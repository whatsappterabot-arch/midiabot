<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiaBot - Conectores de Chat</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen">
        <!-- SIDEBAR: Menu Lateral Dinâmico -->
        <aside class="w-64 bg-[#001f3f] text-white flex flex-col shadow-xl">
            <div class="p-6 text-center border-b border-blue-900">
                <img src="./logo.png" alt="Logo" class="w-12 mx-auto mb-2">
                <h2 class="font-black tracking-tighter text-xl">MÍDIABOT</h2>
            </div>

            <!-- TOGGLE DE PLATAFORMA -->
            <div class="p-4">
                <div class="flex bg-gray-800 rounded-full p-1 shadow-inner">
                    <button onclick="setPlataforma('whatsapp')" id="btn-wa"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md">
                        WHATSAPP
                    </button>
                    <button onclick="setPlataforma('instagram')" id="btn-ig"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700">
                        INSTAGRAM
                    </button>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1 mt-4" id="menu-dinamico">
                <!-- Injetado via Java -->
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col">
            <!-- HEADER -->
            <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-paper-plane text-gray-400"></i>
                    <h1 class="text-sm font-bold text-gray-500 uppercase tracking-widest" id="page-title">Conectores de Chat (WhatsApp)</h1>
                    <button onclick="abrirAjuda()" class="w-5 h-5 rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 transition-colors flex items-center justify-center text-[10px] font-bold">
                        ?
                    </button>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-bold text-gray-800">Carregando...</p>
                        <p id="user-id" class="text-[10px] text-gray-400 font-mono"></p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- ÁREA DE GESTÃO -->
            <section class="p-8 overflow-y-auto flex-1">
                <div class="max-w-5xl mx-auto">

                    <!-- FORMULÁRIO CRIAR SALA -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-200">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Criar sala</label>
                        <div class="grid grid-cols-4 gap-3 items-end">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Fluxo</label>
                                <select id="select-novo-workflow" onchange="onNovoWorkflowChange()"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                                    <option value="">Selecione...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Nome da sala</label>
                                <input type="text" id="input-nova-sala-nome" placeholder="Ex: Atendimento Comercial"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Sender (opcional)</label>
                                <select id="select-novo-sender" disabled
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all disabled:opacity-50">
                                    <option value="">Selecione um fluxo primeiro...</option>
                                </select>
                            </div>
                            <button onclick="criarSala()"
                                class="bg-[#001f3f] text-white px-6 py-3 rounded-xl font-bold text-xs hover:bg-black transition-all shadow-lg active:scale-95">
                                CRIAR SALA
                            </button>
                        </div>
                    </div>

                    <!-- LISTA DE SALAS -->
                    <div id="lista-salas" class="space-y-4"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL AJUDA -->
    <div id="modal-ajuda" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full relative shadow-2xl max-h-[80vh] overflow-y-auto">
            <button onclick="fecharAjuda()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Como funciona</h3>
            <div id="ajuda-conteudo" class="text-sm text-gray-600 leading-relaxed"></div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        const API_URL = CONFIG.API_URL;

        let user = null;
        let plataforma = 'whatsapp';
        let salas = [];
        let orfaosPorWorkflow = {};

        // Inicialização e Proteção de Rota
        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }

            const rawUser = JSON.parse(userData);
            user = Array.isArray(rawUser) ? rawUser[0] : rawUser;

            document.getElementById('user-name').innerText = user.nome || 'Usuário';
            document.getElementById('user-id').innerText = `ID: ${user.id_cliente}`;

            window.setPlataforma = setPlataforma;
            window.onNovoWorkflowChange = onNovoWorkflowChange;
            window.criarSala = criarSala;
            window.atrelarSender = atrelarSender;
            window.desatrelarSender = desatrelarSender;
            window.abrirAjuda = abrirAjuda;
            window.fecharAjuda = fecharAjuda;
            window.logout = logout;

            renderMenu();
            carregarWorkflows();
            carregarSalas();
            carregarAjuda();
        });

        // Lógica de Menu Lateral Dinâmico
        function renderMenu() {
            const menu = document.getElementById('menu-dinamico');
            const waItems = [
                { icon: 'fa-paper-plane', label: 'Envio Ativo' },
                { icon: 'fa-server', label: 'Instâncias', href: 'instancias.html' },
                { icon: 'fa-ban', label: 'Proibições de IA', href: 'proibicoes.html' },
                { icon: 'fa-paper-plane', label: 'Conectores de Chat', active: true },
                { icon: 'fa-user-tie', label: 'Atribuição a Consultores', href: 'consultores.html' },
                { icon: 'fa-users', label: 'Telefones dos Consultores', href: 'vendedores.html' },
                { icon: 'fa-clock', label: 'Horários', href: 'horarios.html' },
                { icon: 'fa-robot', label: 'Prompts', href: 'prompts.html' },
                { icon: 'fa-key', label: 'Cadastro de Consultores', href: 'senhas_chat.html' },
                { icon: 'fa-comments', label: 'Atribuição de Chat', href: 'atribuicao_chat.html' }
            ];
            const igItems = [
                { icon: 'fa-hashtag', label: 'Hashtags' },
                { icon: 'fa-users', label: 'Públicos' },
                { icon: 'fa-chart-line', label: 'Métricas' },
                { icon: 'fa-comments', label: 'Directs' }
            ];

            const items = plataforma === 'whatsapp' ? waItems : igItems;
            menu.innerHTML = items.map(item => `
                <a href="${item.href || '#'}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${item.active ? 'bg-[#00b34d] text-white shadow-lg' : 'text-blue-200 hover:bg-blue-900 hover:text-white'}">
                    <i class="fas ${item.icon} w-5 text-center"></i>
                    <span class="text-xs font-bold uppercase tracking-tighter">${item.label}</span>
                </a>
            `).join('');
        }

        // Função Central de Comunicação com n8n
        async function chamarApi(acao, dadosExtra) {
            const payload = {
                origem: 'conect_telegram',
                plataforma: plataforma,
                acao: acao,
                id_cliente: user.id_cliente,
                dados: dadosExtra
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        async function carregarWorkflows() {
            try {
                const data = await chamarApi('listar_workflows', {});
                const lista = (Array.isArray(data) ? data : []).filter(item => item && item.workflow_name != null);
                const select = document.getElementById('select-novo-workflow');
                select.innerHTML = '<option value="">Selecione...</option>' +
                    lista.map(item => `<option value="${item.workflow_name}">${item.workflow_name}</option>`).join('');
            } catch (e) {
                console.error("Falha ao carregar fluxos:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function onNovoWorkflowChange() {
            const workflow = document.getElementById('select-novo-workflow').value;
            const selectSender = document.getElementById('select-novo-sender');

            if (!workflow) {
                selectSender.disabled = true;
                selectSender.innerHTML = '<option value="">Selecione um fluxo primeiro...</option>';
                return;
            }

            selectSender.disabled = false;
            await sincronizarSenderNovaSala();
        }

        // Reconstrói o dropdown de sender do formulário "Criar sala" a partir do
        // estado atual de orfaosPorWorkflow — chamado sempre que esse estado pode
        // ter mudado (ex: depois de atrelar/desatrelar um sender em qualquer sala).
        async function sincronizarSenderNovaSala() {
            const workflow = document.getElementById('select-novo-workflow').value;
            if (!workflow) return;

            await carregarOrfaos(workflow);
            const selectSender = document.getElementById('select-novo-sender');
            selectSender.innerHTML = '<option value="">Nenhum (criar sem sender)</option>' +
                (orfaosPorWorkflow[workflow] || []).map(s => `<option value="${s.sender}">${s.nome_instancia} (${s.sender})</option>`).join('');
        }

        async function carregarOrfaos(workflow) {
            try {
                const data = await chamarApi('listar_senders_orfaos', { workflow_name: workflow });
                orfaosPorWorkflow[workflow] = (Array.isArray(data) ? data : []).filter(item => item && item.sender != null);
            } catch (e) {
                console.error("Falha ao carregar senders órfãos:", e);
                showToast("Erro ao processar solicitação.", "error");
                orfaosPorWorkflow[workflow] = [];
            }
        }

        async function criarSala() {
            const workflow = document.getElementById('select-novo-workflow').value;
            const inputNome = document.getElementById('input-nova-sala-nome');
            const sender = document.getElementById('select-novo-sender').value;

            if (!workflow) {
                showToast("Selecione um fluxo.", "warning");
                return;
            }
            if (!inputNome.value.trim()) {
                showToast("Preencha o nome da sala.", "warning");
                return;
            }

            try {
                await chamarApi('criar_sala', {
                    workflow_name: workflow,
                    chat_id_nome: inputNome.value.trim(),
                    sender: sender || null
                });
                inputNome.value = '';
                document.getElementById('select-novo-workflow').value = '';
                document.getElementById('select-novo-sender').disabled = true;
                document.getElementById('select-novo-sender').innerHTML = '<option value="">Selecione um fluxo primeiro...</option>';
                showToast("Sala criada com sucesso.", "success");
                await carregarSalas();
            } catch (e) {
                console.error("Falha ao criar sala:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function carregarSalas() {
            try {
                const data = await chamarApi('listar', {});
                const linhas = (Array.isArray(data) ? data : []).filter(item => item && item.chat_id != null);
                salas = agruparSalas(linhas);

                const workflowsUnicos = [...new Set(salas.map(s => s.workflow_name))];
                await Promise.all(workflowsUnicos.map(w => carregarOrfaos(w)));

                renderizarSalas();
                await sincronizarSenderNovaSala();
            } catch (e) {
                console.error("Falha ao carregar salas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function agruparSalas(linhas) {
            const porChatId = {};
            linhas.forEach(row => {
                if (!porChatId[row.chat_id]) {
                    porChatId[row.chat_id] = {
                        chat_id: row.chat_id,
                        chat_id_nome: row.chat_id_nome,
                        workflow_name: row.workflow_name,
                        senders: []
                    };
                }
                if (row.sender) porChatId[row.chat_id].senders.push(row.sender);
            });
            return Object.values(porChatId);
        }

        function renderizarSalas() {
            const container = document.getElementById('lista-salas');
            if (salas.length === 0) {
                container.innerHTML = '<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-12 text-center text-gray-300 text-xs font-bold uppercase tracking-widest">Nenhuma sala cadastrada</div>';
                return;
            }

            container.innerHTML = salas.map(sala => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <div class="mb-4">
                        <p class="text-sm font-bold text-gray-800">${sala.chat_id_nome || '(sem nome)'}</p>
                        <p class="text-[10px] text-gray-400 font-mono mt-1">Chat ID: ${sala.chat_id} &middot; ${sala.workflow_name}</p>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${sala.senders.length === 0
                            ? '<span class="text-xs text-gray-300">Nenhum sender atrelado</span>'
                            : sala.senders.map(s => `
                                <span class="inline-flex items-center gap-2 bg-gray-100 rounded-full pl-3 pr-2 py-1.5 text-xs font-mono text-gray-600">
                                    ${s}
                                    <button onclick="desatrelarSender('${s}')" class="text-gray-400 hover:text-red-500 transition-colors">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </span>
                            `).join('')}
                    </div>
                    <div class="flex gap-2">
                        <select id="select-add-sender-${sala.chat_id}"
                            class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                            <option value="">Adicionar sender órfão...</option>
                            ${(orfaosPorWorkflow[sala.workflow_name] || []).map(s => `<option value="${s.sender}">${s.nome_instancia} (${s.sender})</option>`).join('')}
                        </select>
                        <button onclick="atrelarSender(${sala.chat_id})"
                            class="bg-[#001f3f] text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-black transition-all shadow active:scale-95">
                            ATRELAR
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function atrelarSender(chatId) {
            const select = document.getElementById(`select-add-sender-${chatId}`);
            const sender = select.value;

            if (!sender) {
                showToast("Selecione um sender.", "warning");
                return;
            }

            try {
                await chamarApi('atrelar_sender', { sender, chat_id: chatId });
                showToast("Sender atrelado com sucesso.", "success");
                await carregarSalas();
            } catch (e) {
                console.error("Falha ao atrelar sender:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function desatrelarSender(sender) {
            try {
                await chamarApi('desatrelar_sender', { sender });
                showToast("Sender desatrelado com sucesso.", "success");
                await carregarSalas();
            } catch (e) {
                console.error("Falha ao desatrelar sender:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function setPlataforma(p) {
            plataforma = p;
            const isWA = p === 'whatsapp';

            document.getElementById('btn-wa').className = isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('btn-ig').className = !isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('page-title').innerText = `Conectores de Chat (${isWA ? 'WhatsApp' : 'Instagram'})`;

            renderMenu();
            carregarWorkflows();
            carregarSalas();
        }

        async function carregarAjuda() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        origem: 'instrucoes',
                        plataforma: plataforma,
                        acao: 'buscar',
                        id_cliente: user.id_cliente,
                        dados: { info_pagina: 'telegram_sender' }
                    })
                });
                if (!res.ok) throw new Error("Erro na API");
                const data = await res.json();
                const item = Array.isArray(data) ? data[0] : data;
                document.getElementById('ajuda-conteudo').innerHTML = item?.texto_instrucao || 'Instrução ainda não cadastrada.';
            } catch (e) {
                console.error("Falha ao carregar instrução:", e);
            }
        }

        function abrirAjuda() {
            document.getElementById('modal-ajuda').classList.remove('hidden');
        }

        function fecharAjuda() {
            document.getElementById('modal-ajuda').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('midiabot_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
