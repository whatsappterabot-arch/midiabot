<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MídiaBot - Questionário de Instalação</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto py-10 px-4">
        <div class="flex items-center gap-3 mb-8">
            <img src="./logo.png" alt="Logo" class="w-10">
            <div>
                <h1 class="text-lg font-black text-[#001f3f] tracking-tight">Questionário de Instalação</h1>
                <p class="text-xs text-gray-400" id="passo-indicador"></p>
            </div>
        </div>

        <div id="conteudo" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8"></div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        let user = null;
        let passoAtual = 1;
        let instanciasDisponiveis = [];
        let dados = { salas: [], vendedores: [] };

        const NOMES_PASSO = {
            1: 'Passo 1 de 6 — Telefones',
            2: 'Passo 2 de 6 — Salas',
            3: 'Passo 3 de 6 — Vendedores',
            4: 'Passo 4 de 6 — Distribuição nas salas compartilhadas',
            5: 'Passo 5 de 6 — Donos das salas dedicadas',
            6: 'Passo 6 de 6 — Revisão'
        };

        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData || userData === "undefined") {
                window.location.href = 'index.html';
                return;
            }
            const rawUser = JSON.parse(userData);
            user = Array.isArray(rawUser) ? rawUser[0] : rawUser;

            carregarInstancias();
        });

        async function chamarApi(acao, dadosExtra) {
            const payload = {
                origem: 'dashboard',
                plataforma: 'whatsapp',
                acao: acao,
                id_cliente: user.id_cliente ?? user.id,
                dados: dadosExtra
            };
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        // Reaproveita a mesma ação já usada em instancias.html
        async function chamarApiInstancias(acao, dadosExtra) {
            const payload = {
                origem: 'instancias',
                plataforma: 'whatsapp',
                acao: acao,
                id_cliente: user.id_cliente ?? user.id,
                dados: dadosExtra
            };
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        async function carregarInstancias() {
            try {
                const resultado = await chamarApiInstancias('listar_instancias', {});
                instanciasDisponiveis = Array.isArray(resultado) ? resultado : [];
            } catch (e) {
                console.error('Erro ao carregar instâncias:', e);
                showToast('Não foi possível carregar as instâncias.', 'error');
            }
            render();
        }

        function render() {
            document.getElementById('passo-indicador').innerText = NOMES_PASSO[passoAtual] || '';
            const el = document.getElementById('conteudo');
            if (passoAtual === 1) el.innerHTML = telaGate();
            else if (passoAtual === 2) el.innerHTML = telaSalas();
            else if (passoAtual === 3) el.innerHTML = telaVendedores();
            else if (passoAtual === 4) el.innerHTML = telaDistribuicao();
            else if (passoAtual === 5) el.innerHTML = telaDonos();
            else if (passoAtual === 6) el.innerHTML = telaRevisao();
            window.__ligarEventos && window.__ligarEventos();
        }

        // ===== Passo 1 — Gate das instâncias =====
        function telaGate() {
            const linhas = instanciasDisponiveis.map(i => {
                const conectado = i.connectionStatus === 'open' || !!i.sender;
                return `<div class="flex items-center justify-between border border-gray-200 rounded-xl px-4 py-3">
                    <span class="font-bold text-gray-700 text-sm">${i.nome_instancia}</span>
                    <span class="text-xs font-bold uppercase tracking-widest ${conectado ? 'text-[#00b34d]' : 'text-red-400'}">
                        ${conectado ? 'Conectado' : 'Não conectado'}
                    </span>
                </div>`;
            }).join('');

            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Estes são os telefones configurados hoje</h2>
                <p class="text-sm text-gray-500 mb-6">Confira a lista antes de continuar — a instalação vai usar exatamente estes números.</p>
                <div class="space-y-2 mb-6">${linhas || '<p class="text-sm text-gray-400">Nenhuma instância encontrada.</p>'}</div>
                <p class="text-sm font-bold text-gray-700 mb-4">Esse é o número certo de telefones que você vai usar?</p>
                <div class="flex gap-3">
                    <button data-acao="gate-nao" class="flex-1 px-5 py-3 border border-gray-300 text-gray-600 font-bold rounded-xl hover:bg-gray-50">Não, preciso corrigir</button>
                    <button data-acao="gate-sim" class="flex-1 px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Sim, está certo</button>
                </div>
                <div id="gate-aviso" class="hidden mt-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-sm text-amber-800">
                    Antes de continuar, vá em <a href="instancias.html" class="underline font-bold">Instâncias</a> e conecte/corrija os números que faltam. Volte aqui depois.
                </div>
            `;
        }

        // ===== Passo 2 — Salas =====
        function telaSalas() {
            const linhasSalas = dados.salas.map((s, idx) => `
                <div class="border border-gray-200 rounded-xl p-4 mb-3">
                    <div class="flex items-center justify-between mb-3">
                        <input type="text" value="${s.nome}" data-sala-nome="${idx}" placeholder="Nome da sala"
                            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm font-bold mr-3">
                        <button data-remover-sala="${idx}" class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-600 mb-3">
                        <input type="checkbox" data-sala-compartilhada="${idx}" ${s.compartilhada ? 'checked' : ''}>
                        Sala compartilhada (mais de um vendedor pode atender)
                    </label>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Telefones desta sala</p>
                    <div class="flex flex-wrap gap-2">
                        ${instanciasDisponiveis.map(i => `
                            <label class="flex items-center gap-1.5 text-xs border border-gray-200 rounded-full px-3 py-1.5">
                                <input type="checkbox" data-sala-instancia="${idx}" value="${i.nome_instancia}"
                                    ${s.instancias.includes(i.nome_instancia) ? 'checked' : ''}>
                                ${i.nome_instancia}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Quais salas você vai usar?</h2>
                <p class="text-sm text-gray-500 mb-6">Uma sala pode ter mais de um telefone. Adicione quantas precisar.</p>
                ${linhasSalas}
                <button data-acao="add-sala" class="text-sm font-bold text-[#00b34d] hover:underline mb-6"><i class="fas fa-plus mr-1"></i>Adicionar sala</button>
                <div class="flex justify-between">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="proximo" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
                </div>
            `;
        }

        // ===== Passo 3 — Vendedores =====
        function telaVendedores() {
            const linhas = dados.vendedores.map((v, idx) => `
                <div class="flex items-center gap-3 mb-3">
                    <input type="text" value="${v.nome_vendedor}" data-vendedor-nome="${idx}" placeholder="Nome do vendedor"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="password" value="${v.senha}" data-vendedor-senha="${idx}" placeholder="Senha"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <button data-remover-vendedor="${idx}" class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Cadastre os vendedores</h2>
                <p class="text-sm text-gray-500 mb-6">Nome e senha de acesso ao MidiaChat. Até 10 vendedores.</p>
                ${linhas}
                ${dados.vendedores.length < 10 ? `<button data-acao="add-vendedor" class="text-sm font-bold text-[#00b34d] hover:underline mb-6"><i class="fas fa-plus mr-1"></i>Adicionar vendedor</button>` : ''}
                <div class="flex justify-between mt-4">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="proximo" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
                </div>
            `;
        }

        // ===== Passo 4 — Distribuição nas salas compartilhadas =====
        function telaDistribuicao() {
            const salasCompartilhadas = dados.salas.filter(s => s.compartilhada);
            if (salasCompartilhadas.length === 0) {
                passoAtual = 5;
                return telaDonos();
            }
            const blocos = salasCompartilhadas.map((s) => {
                const idx = dados.salas.indexOf(s);
                return `
                <div class="border border-gray-200 rounded-xl p-4 mb-3">
                    <p class="font-bold text-gray-700 text-sm mb-3">${s.nome || '(sem nome)'}</p>
                    <div class="flex gap-4 mb-3">
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="sorteio-${idx}" value="auto" ${s.sorteio !== 'manual' ? 'checked' : ''} data-sorteio-tipo="${idx}">
                            Rotaciona automaticamente entre os vendedores ativos
                        </label>
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="sorteio-${idx}" value="manual" ${s.sorteio === 'manual' ? 'checked' : ''} data-sorteio-tipo="${idx}">
                            Um vendedor fixo
                        </label>
                    </div>
                    ${s.sorteio === 'manual' ? `
                        <select data-sorteio-vendedor="${idx}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="">Escolha o vendedor</option>
                            ${dados.vendedores.map((v, vi) => `<option value="${vi + 1}" ${s.vendedor_escolhido == vi + 1 ? 'selected' : ''}>${v.nome_vendedor}</option>`).join('')}
                        </select>
                    ` : ''}
                </div>`;
            }).join('');

            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Como distribuir os clientes nas salas compartilhadas?</h2>
                <p class="text-sm text-gray-500 mb-6">Só aparece aqui as salas marcadas como compartilhadas.</p>
                ${blocos}
                <div class="flex justify-between mt-4">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="proximo" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
                </div>
            `;
        }

        // ===== Passo 5 — Donos das salas dedicadas =====
        function telaDonos() {
            const salasDedicadas = dados.salas.filter(s => !s.compartilhada);
            if (salasDedicadas.length === 0) {
                passoAtual = 6;
                return telaRevisao();
            }
            const blocos = salasDedicadas.map((s) => {
                const idx = dados.salas.indexOf(s);
                return `
                <div class="border border-gray-200 rounded-xl p-4 mb-3 flex items-center justify-between">
                    <p class="font-bold text-gray-700 text-sm">${s.nome || '(sem nome)'}</p>
                    <select data-dono="${idx}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Escolha o vendedor</option>
                        ${dados.vendedores.map((v, vi) => `<option value="${vi + 1}" ${s.vendedor_dono == vi + 1 ? 'selected' : ''}>${v.nome_vendedor}</option>`).join('')}
                    </select>
                </div>`;
            }).join('');

            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Quem é o dono de cada sala dedicada?</h2>
                <p class="text-sm text-gray-500 mb-6">Só aparece aqui as salas que não são compartilhadas.</p>
                ${blocos}
                <div class="flex justify-between mt-4">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="proximo" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
                </div>
            `;
        }

        // ===== Passo 6 — Revisão e envio =====
        function telaRevisao() {
            return `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Revisão</h2>
                <p class="text-sm text-gray-500 mb-6">${dados.salas.length} sala(s), ${dados.vendedores.length} vendedor(es). Confirma a instalação?</p>
                <ul class="text-sm text-gray-600 space-y-1 mb-6 list-disc list-inside">
                    ${dados.salas.map(s => `<li>${s.nome} — ${s.compartilhada ? 'compartilhada' : 'dedicada'} — ${s.instancias.join(', ') || 'nenhum telefone'}</li>`).join('')}
                </ul>
                <div class="flex justify-between">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="finalizar" id="btn-finalizar" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Finalizar instalação</button>
                </div>
            `;
        }

        function telaSucesso() {
            document.getElementById('conteudo').innerHTML = `
                <h2 class="text-lg font-bold text-gray-800 mb-2">Instalação concluída</h2>
                <p class="text-sm text-gray-500 mb-6">Falta configurar mais três coisas, cada uma na sua própria tela:</p>
                <div class="space-y-2 mb-6">
                    <a href="prompts.html" class="block border border-gray-200 rounded-xl px-4 py-3 hover:bg-gray-50"><i class="fas fa-robot mr-2 text-gray-400"></i>Prompts — o que a IA vai responder</a>
                    <a href="horarios.html" class="block border border-gray-200 rounded-xl px-4 py-3 hover:bg-gray-50"><i class="fas fa-clock mr-2 text-gray-400"></i>Horários — quando cada prompt vale</a>
                    <a href="proibicoes.html" class="block border border-gray-200 rounded-xl px-4 py-3 hover:bg-gray-50"><i class="fas fa-ban mr-2 text-gray-400"></i>Proibições de IA — números que nunca devem passar pela IA</a>
                </div>
                <a href="dashboard.html" class="text-sm font-bold text-gray-500 hover:underline">Voltar ao painel</a>
            `;
        }

        // ===== Eventos (delegado, re-ligado a cada render) =====
        window.__ligarEventos = function () {
            const el = document.getElementById('conteudo');

            el.querySelectorAll('[data-acao="gate-sim"]').forEach(b => b.onclick = () => { passoAtual = 2; render(); });
            el.querySelectorAll('[data-acao="gate-nao"]').forEach(b => b.onclick = () => document.getElementById('gate-aviso').classList.remove('hidden'));

            el.querySelectorAll('[data-acao="add-sala"]').forEach(b => b.onclick = () => { dados.salas.push({ nome: '', compartilhada: false, instancias: [] }); render(); });
            el.querySelectorAll('[data-remover-sala]').forEach(b => b.onclick = () => { dados.salas.splice(+b.dataset.removerSala, 1); render(); });
            el.querySelectorAll('[data-sala-nome]').forEach(i => i.oninput = () => { dados.salas[+i.dataset.salaNome].nome = i.value; });
            el.querySelectorAll('[data-sala-compartilhada]').forEach(i => i.onchange = () => { dados.salas[+i.dataset.salaCompartilhada].compartilhada = i.checked; });
            el.querySelectorAll('[data-sala-instancia]').forEach(i => i.onchange = () => {
                const s = dados.salas[+i.dataset.salaInstancia];
                if (i.checked) s.instancias.push(i.value);
                else s.instancias = s.instancias.filter(v => v !== i.value);
            });

            el.querySelectorAll('[data-acao="add-vendedor"]').forEach(b => b.onclick = () => { dados.vendedores.push({ nome_vendedor: '', senha: '' }); render(); });
            el.querySelectorAll('[data-remover-vendedor]').forEach(b => b.onclick = () => { dados.vendedores.splice(+b.dataset.removerVendedor, 1); render(); });
            el.querySelectorAll('[data-vendedor-nome]').forEach(i => i.oninput = () => { dados.vendedores[+i.dataset.vendedorNome].nome_vendedor = i.value; });
            el.querySelectorAll('[data-vendedor-senha]').forEach(i => i.oninput = () => { dados.vendedores[+i.dataset.vendedorSenha].senha = i.value; });

            el.querySelectorAll('[data-sorteio-tipo]').forEach(i => i.onchange = () => { dados.salas[+i.dataset.sorteioTipo].sorteio = i.value; render(); });
            el.querySelectorAll('[data-sorteio-vendedor]').forEach(i => i.onchange = () => { dados.salas[+i.dataset.sorteioVendedor].vendedor_escolhido = i.value; });
            el.querySelectorAll('[data-dono]').forEach(i => i.onchange = () => { dados.salas[+i.dataset.dono].vendedor_dono = i.value; });

            el.querySelectorAll('[data-acao="proximo"]').forEach(b => b.onclick = () => { passoAtual++; render(); });
            el.querySelectorAll('[data-acao="voltar"]').forEach(b => b.onclick = () => { passoAtual--; render(); });
            el.querySelectorAll('[data-acao="finalizar"]').forEach(b => b.onclick = finalizarInstalacao);
        };

        async function finalizarInstalacao() {
            const botao = document.getElementById('btn-finalizar');
            botao.disabled = true;
            botao.innerText = 'Enviando...';

            const payload = {
                salas: dados.salas.map((s, idx) => ({
                    nome: s.nome,
                    compartilhada: s.compartilhada,
                    instancias: s.instancias,
                    sorteio: s.sorteio || 'auto',
                    vendedor_escolhido: s.vendedor_escolhido || null,
                    vendedor_dono: s.vendedor_dono || null
                })),
                vendedores: dados.vendedores.map((v, idx) => ({
                    id_vendedor: idx + 1,
                    nome_vendedor: v.nome_vendedor,
                    senha: v.senha
                }))
            };

            try {
                await chamarApi('configurar_cliente', payload);
                telaSucesso();
            } catch (e) {
                console.error('Erro ao finalizar instalação:', e);
                showToast('Não foi possível concluir a instalação. Tenta de novo.', 'error');
                botao.disabled = false;
                botao.innerText = 'Finalizar instalação';
            }
        }
    </script>
</body>
</html>
