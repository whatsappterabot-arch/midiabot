<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiaBot - Lista de Consultores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen">
        <!-- SIDEBAR: Menu Lateral Dinâmico -->
        <aside class="w-64 bg-[#001f3f] text-white flex flex-col shadow-xl">
            <div class="p-6 text-center border-b border-blue-900">
                <img src="./logo.png" alt="Logo" class="w-12 mx-auto mb-2">
                <h2 class="font-black tracking-tighter text-xl">MÍDIABOT</h2>
            </div>

            <!-- TOGGLE DE PLATAFORMA -->
            <div class="p-4">
                <div class="flex bg-gray-800 rounded-full p-1 shadow-inner">
                    <button onclick="setPlataforma('whatsapp')" id="btn-wa"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md">
                        WHATSAPP
                    </button>
                    <button onclick="setPlataforma('instagram')" id="btn-ig"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700">
                        INSTAGRAM
                    </button>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1 mt-4" id="menu-dinamico">
                <!-- Injetado via Java -->
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col">
            <!-- HEADER -->
            <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-users text-gray-400"></i>
                    <h1 class="text-sm font-bold text-gray-500 uppercase tracking-widest" id="page-title">Lista de Consultores (WhatsApp)</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-bold text-gray-800">Carregando...</p>
                        <p id="user-id" class="text-[10px] text-gray-400 font-mono"></p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- ÁREA DE GESTÃO -->
            <section class="p-8 overflow-y-auto flex-1">
                <div class="max-w-5xl mx-auto">

                    <!-- SELEÇÃO DE FLUXO -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-200">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Fluxo</label>
                        <select id="select-workflow" onchange="onWorkflowChange()"
                            class="w-full max-w-md bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                            <option value="">Selecione um fluxo...</option>
                        </select>
                    </div>

                    <!-- TABELA DE CONSULTORES -->
                    <div id="painel-tabela" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">Cor</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Nome</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">Ativo</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Telegram Color ID</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Sender</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-corpo" class="divide-y divide-gray-100">
                                <!-- Injetado via Java -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { CONFIG } from "./config.js";

        const API_URL = CONFIG.API_URL;

        let user = null;
        let plataforma = 'whatsapp';
        let workflowSelecionado = '';

        // Inicialização e Proteção de Rota
        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }

            const rawUser = JSON.parse(userData);
            user = Array.isArray(rawUser) ? rawUser[0] : rawUser;

            // Hidratação da UI
            document.getElementById('user-name').innerText = user.nome || 'Usuário';
            document.getElementById('user-id').innerText = `ID: ${user.id_cliente}`;

            // Exposição de funções para o escopo global (necessário para onclick em módulos)
            window.setPlataforma = setPlataforma;
            window.onWorkflowChange = onWorkflowChange;
            window.salvarVendedor = salvarVendedor;
            window.logout = logout;

            renderMenu();
            carregarWorkflows();
        });

        // Lógica de Menu Lateral Dinâmico
        function renderMenu() {
            const menu = document.getElementById('menu-dinamico');
            const waItems = [
                { icon: 'fa-paper-plane', label: 'Envio Ativo' },
                { icon: 'fa-server', label: 'Instâncias' },
                { icon: 'fa-ban', label: 'Proibições de IA', href: 'proibicoes.html' },
                { icon: 'fa-paper-plane', label: 'Conectores de Telegram', href: 'telegram_sender.html' },
                { icon: 'fa-user-tie', label: 'Atribuição a Consultores', href: 'consultores.html' },
                { icon: 'fa-users', label: 'Lista de Consultores', active: true },
                { icon: 'fa-ellipsis-h', label: 'Opção 7' }
            ];
            const igItems = [
                { icon: 'fa-hashtag', label: 'Hashtags' },
                { icon: 'fa-users', label: 'Públicos' },
                { icon: 'fa-chart-line', label: 'Métricas' },
                { icon: 'fa-comments', label: 'Directs' }
            ];

            const items = plataforma === 'whatsapp' ? waItems : igItems;
            menu.innerHTML = items.map(item => `
                <a href="${item.href || '#'}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${item.active ? 'bg-[#00b34d] text-white shadow-lg' : 'text-blue-200 hover:bg-blue-900 hover:text-white'}">
                    <i class="fas ${item.icon} w-5 text-center"></i>
                    <span class="text-xs font-bold uppercase tracking-tighter">${item.label}</span>
                </a>
            `).join('');
        }

        // Função Central de Comunicação com n8n
        async function chamarApi(acao, dadosExtra) {
            const payload = {
                origem: 'vendedores',
                plataforma: plataforma,
                acao: acao, // 'listar_workflows', 'listar', 'salvar'
                id_cliente: user.id_cliente,
                dados: dadosExtra
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        async function carregarWorkflows() {
            try {
                const data = await chamarApi('listar_workflows', {});
                const select = document.getElementById('select-workflow');
                const lista = Array.isArray(data) ? data : [];
                select.innerHTML = '<option value="">Selecione um fluxo...</option>' +
                    lista.map(item => `<option value="${item.workflow_name}">${item.workflow_name}</option>`).join('');
            } catch (e) {
                console.error("Falha ao carregar fluxos:", e);
                alert("Erro ao processar solicitação.");
            }
        }

        function onWorkflowChange() {
            const select = document.getElementById('select-workflow');
            workflowSelecionado = select.value;
            const painel = document.getElementById('painel-tabela');

            if (!workflowSelecionado) {
                painel.classList.add('hidden');
                return;
            }

            painel.classList.remove('hidden');
            carregarVendedores();
        }

        async function carregarVendedores() {
            try {
                const data = await chamarApi('listar', { workflow_name: workflowSelecionado });
                renderizarTabela(Array.isArray(data) ? data : []);
            } catch (e) {
                console.error("Falha ao carregar consultores:", e);
                alert("Erro ao processar solicitação.");
            }
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('tabela-corpo');
            if (!dados || dados.length === 0) {
                corpo.innerHTML = '<tr><td colspan="6" class="p-12 text-center text-gray-300 text-xs font-bold uppercase tracking-widest">Nenhum consultor encontrado</td></tr>';
                return;
            }

            corpo.innerHTML = dados.map(item => `
                <tr class="hover:bg-gray-50 transition-colors group">
                    <td class="px-6 py-4 text-center text-lg">${item.cor_emoji || ''}</td>
                    <td class="px-6 py-4">
                        <input type="text" id="nome-${item.id_vendedor}" value="${item.nome_vendedor || ''}"
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                    </td>
                    <td class="px-6 py-4 text-center">
                        <input type="checkbox" id="ativo-${item.id_vendedor}" ${item.ativo === 1 ? 'checked' : ''}
                            class="w-5 h-5 accent-[#00b34d] cursor-pointer">
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 font-mono">${item.telegram_color_id ?? ''}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 font-mono">${item.sender ?? ''}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="salvarVendedor(${item.id_vendedor})"
                            class="bg-[#001f3f] text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-black transition-all shadow active:scale-95">
                            SALVAR
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function salvarVendedor(idVendedor) {
            const inputNome = document.getElementById(`nome-${idVendedor}`);
            const inputAtivo = document.getElementById(`ativo-${idVendedor}`);

            try {
                await chamarApi('salvar', {
                    workflow_name: workflowSelecionado,
                    id_vendedor: idVendedor,
                    nome_vendedor: inputNome.value,
                    ativo: inputAtivo.checked ? 1 : 0
                });
                alert("Consultor salvo com sucesso.");
            } catch (e) {
                console.error("Falha ao salvar consultor:", e);
                alert("Erro ao processar solicitação.");
            }
        }

        function setPlataforma(p) {
            plataforma = p;
            const isWA = p === 'whatsapp';

            document.getElementById('btn-wa').className = isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('btn-ig').className = !isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('page-title').innerText = `Lista de Consultores (${isWA ? 'WhatsApp' : 'Instagram'})`;

            renderMenu();
        }

        function logout() {
            localStorage.removeItem('midiabot_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
