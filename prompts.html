<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiaBot - Prompts</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen">
        <!-- SIDEBAR: Menu Lateral Dinâmico -->
        <aside class="w-64 bg-[#001f3f] text-white flex flex-col shadow-xl">
            <div class="p-6 text-center border-b border-blue-900">
                <img src="./logo.png" alt="Logo" class="w-12 mx-auto mb-2">
                <h2 class="font-black tracking-tighter text-xl">MÍDIABOT</h2>
            </div>

            <!-- TOGGLE DE PLATAFORMA -->
            <div class="p-4">
                <div class="flex bg-gray-800 rounded-full p-1 shadow-inner">
                    <button onclick="setPlataforma('whatsapp')" id="btn-wa"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md">
                        WHATSAPP
                    </button>
                    <button onclick="setPlataforma('instagram')" id="btn-ig"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700">
                        INSTAGRAM
                    </button>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1 mt-4" id="menu-dinamico">
                <!-- Injetado via Java -->
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col">
            <!-- HEADER -->
            <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-robot text-gray-400"></i>
                    <h1 class="text-sm font-bold text-gray-500 uppercase tracking-widest" id="page-title">Prompts (WhatsApp)</h1>
                    <button onclick="abrirAjuda()" class="w-5 h-5 rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 transition-colors flex items-center justify-center text-[10px] font-bold">
                        ?
                    </button>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-bold text-gray-800">Carregando...</p>
                        <p id="user-id" class="text-[10px] text-gray-400 font-mono"></p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- ÁREA DE GESTÃO -->
            <section class="p-8 overflow-y-auto flex-1">
                <div class="max-w-4xl mx-auto">

                    <!-- SELEÇÃO DE FLUXO E SALA -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-200">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Fluxo</label>
                                <select id="select-workflow" onchange="onWorkflowChange()"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                                    <option value="">Selecione um fluxo...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Sala (Chat)</label>
                                <select id="select-chatid" onchange="onChatIdChange()" disabled
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all disabled:opacity-50">
                                    <option value="">Selecione um fluxo primeiro...</option>
                                </select>
                            </div>
                        </div>
                        <div id="aviso-salas-incompletas" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700"></div>
                    </div>

                    <!-- PROMPTS -->
                    <div id="painel-prompts" class="hidden space-y-6">

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Prompt — Horário de Trabalho</label>
                            <textarea id="prompt-trabalho" rows="10" oninput="atualizarContador('prompt-trabalho','contador-trabalho')"
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm leading-relaxed focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all resize-y"
                                placeholder="Instruções para a IA durante o horário de trabalho..."></textarea>
                            <p id="contador-trabalho" class="text-right text-[10px] text-gray-400 mt-2">0 caracteres</p>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Prompt — Fora do Horário de Trabalho</label>
                            <textarea id="prompt-fora" rows="10" oninput="atualizarContador('prompt-fora','contador-fora')"
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm leading-relaxed focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all resize-y"
                                placeholder="Instruções para a IA fora do horário de trabalho..."></textarea>
                            <p id="contador-fora" class="text-right text-[10px] text-gray-400 mt-2">0 caracteres</p>
                        </div>

                        <button onclick="salvarPrompts()"
                            class="bg-[#001f3f] text-white px-8 py-3 rounded-xl font-bold text-xs hover:bg-black transition-all shadow-lg active:scale-95">
                            SALVAR OS DOIS PROMPTS
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL AJUDA -->
    <div id="modal-ajuda" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full relative shadow-2xl max-h-[80vh] overflow-y-auto">
            <button onclick="fecharAjuda()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Como funciona</h3>
            <div id="ajuda-conteudo" class="text-sm text-gray-600 leading-relaxed"></div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        const API_URL = CONFIG.API_URL;

        let user = null;
        let plataforma = 'whatsapp';
        let workflowSelecionado = '';
        let chatIdSelecionado = '';

        // Inicialização e Proteção de Rota
        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }

            const rawUser = JSON.parse(userData);
            user = Array.isArray(rawUser) ? rawUser[0] : rawUser;

            if (!user.termos_aceitos_em) { window.location.href = 'cadastro.html'; return; }

            document.getElementById('user-name').innerText = user.nome || 'Usuário';
            document.getElementById('user-id').innerText = `ID: ${user.id_cliente}`;

            window.setPlataforma = setPlataforma;
            window.onWorkflowChange = onWorkflowChange;
            window.onChatIdChange = onChatIdChange;
            window.atualizarContador = atualizarContador;
            window.salvarPrompts = salvarPrompts;
            window.abrirAjuda = abrirAjuda;
            window.fecharAjuda = fecharAjuda;
            window.logout = logout;

            renderMenu();
            carregarWorkflows();
            carregarAjuda();
        });

        // Lógica de Menu Lateral Dinâmico
        function renderMenu() {
            const menu = document.getElementById('menu-dinamico');
            const waItems = [
                { icon: 'fa-paper-plane', label: 'Envio Ativo', href: 'envio_ativo.html' },
                { icon: 'fa-server', label: 'Instâncias', href: 'instancias.html' },
                { icon: 'fa-ban', label: 'Proibições de IA', href: 'proibicoes.html' },
                { icon: 'fa-paper-plane', label: 'Configurar Salas', href: 'configurar_salas.html' },
                { icon: 'fa-user-tie', label: 'Atribuição a Consultores', href: 'consultores.html' },
                { icon: 'fa-users', label: 'Telefones dos Consultores', href: 'vendedores.html' },
                { icon: 'fa-clock', label: 'Horários', href: 'horarios.html' },
                { icon: 'fa-robot', label: 'Prompts', active: true },
                { icon: 'fa-key', label: 'Cadastro de Consultores', href: 'senhas_chat.html' },
                { icon: 'fa-comments', label: 'Atribuição de Chat', href: 'atribuicao_chat.html' }
            ];
            const igItems = [
                { icon: 'fa-hashtag', label: 'Hashtags' },
                { icon: 'fa-users', label: 'Públicos' },
                { icon: 'fa-chart-line', label: 'Métricas' },
                { icon: 'fa-comments', label: 'Directs' }
            ];

            const items = plataforma === 'whatsapp' ? waItems : igItems;
            menu.innerHTML = items.map(item => `
                <a href="${item.href || '#'}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${item.active ? 'bg-[#00b34d] text-white shadow-lg' : 'text-blue-200 hover:bg-blue-900 hover:text-white'}">
                    <i class="fas ${item.icon} w-5 text-center"></i>
                    <span class="text-xs font-bold uppercase tracking-tighter">${item.label}</span>
                </a>
            `).join('');
        }

        // Função Central de Comunicação com n8n
        async function chamarApi(acao, dadosExtra) {
            const payload = {
                origem: 'prompts_ia',
                plataforma: plataforma,
                acao: acao,
                id_cliente: user.id_cliente,
                dados: dadosExtra
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        async function carregarWorkflows() {
            try {
                const data = await chamarApi('listar_workflows', {});
                const select = document.getElementById('select-workflow');
                const lista = (Array.isArray(data) ? data : []).filter(item => item && item.workflow_name != null);
                select.innerHTML = '<option value="">Selecione um fluxo...</option>' +
                    lista.map(item => `<option value="${item.workflow_name}">${item.workflow_name}</option>`).join('');
            } catch (e) {
                console.error("Falha ao carregar fluxos:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function onWorkflowChange() {
            const select = document.getElementById('select-workflow');
            workflowSelecionado = select.value;
            const selectChatId = document.getElementById('select-chatid');
            const painel = document.getElementById('painel-prompts');

            painel.classList.add('hidden');
            chatIdSelecionado = '';

            if (!workflowSelecionado) {
                selectChatId.disabled = true;
                selectChatId.innerHTML = '<option value="">Selecione um fluxo primeiro...</option>';
                return;
            }

            try {
                const data = await chamarApi('listar_chatids', { workflow_name: workflowSelecionado });
                const salas = (Array.isArray(data) ? data : []).filter(item => item && item.chat_id != null);
                selectChatId.disabled = false;
                selectChatId.innerHTML = '<option value="">Selecione uma sala...</option>' +
                    salas.map(item => {
                        const incompleta = Number(item.prompts_configurados) < 2;
                        return `<option value="${item.chat_id}">${incompleta ? '⚠️ ' : ''}${item.chat_id_nome || item.chat_id}</option>`;
                    }).join('');

                const incompletas = salas.filter(item => Number(item.prompts_configurados) < 2);
                const avisoEl = document.getElementById('aviso-salas-incompletas');
                if (incompletas.length > 0) {
                    avisoEl.classList.remove('hidden');
                    avisoEl.innerHTML = `<strong>⚠️ Atenção:</strong> ${incompletas.length} sala(s) sem os dois prompts configurados (dentro e fora do expediente) — a IA não vai responder automaticamente nelas: ${incompletas.map(s => s.chat_id_nome || s.chat_id).join(', ')}.`;
                } else {
                    avisoEl.classList.add('hidden');
                }
            } catch (e) {
                console.error("Falha ao carregar salas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function onChatIdChange() {
            const select = document.getElementById('select-chatid');
            chatIdSelecionado = select.value;
            const painel = document.getElementById('painel-prompts');

            if (!chatIdSelecionado) {
                painel.classList.add('hidden');
                return;
            }

            painel.classList.remove('hidden');
            carregarPrompts();
        }

        async function carregarPrompts() {
            try {
                const data = await chamarApi('buscar_prompts', { chat_id: chatIdSelecionado });
                const lista = (Array.isArray(data) ? data : []).filter(item => item && item.trabalho_on != null);
                const trabalho = lista.find(i => i.trabalho_on === 1);
                const fora = lista.find(i => i.trabalho_on === 0);

                document.getElementById('prompt-trabalho').value = trabalho?.prompt || '';
                document.getElementById('prompt-fora').value = fora?.prompt || '';

                atualizarContador('prompt-trabalho', 'contador-trabalho');
                atualizarContador('prompt-fora', 'contador-fora');
            } catch (e) {
                console.error("Falha ao carregar prompts:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function atualizarContador(textareaId, contadorId) {
            const textarea = document.getElementById(textareaId);
            document.getElementById(contadorId).innerText = `${textarea.value.length} caracteres`;
        }

        async function salvarPrompts() {
            if (!chatIdSelecionado) return;

            try {
                await chamarApi('salvar_prompts', {
                    chat_id: chatIdSelecionado,
                    prompt_trabalho: document.getElementById('prompt-trabalho').value,
                    prompt_fora: document.getElementById('prompt-fora').value
                });
                showToast("Os dois prompts foram salvos.", "success");
            } catch (e) {
                console.error("Falha ao salvar prompts:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function setPlataforma(p) {
            plataforma = p;
            const isWA = p === 'whatsapp';

            document.getElementById('btn-wa').className = isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('btn-ig').className = !isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('page-title').innerText = `Prompts (${isWA ? 'WhatsApp' : 'Instagram'})`;

            renderMenu();
        }

        async function carregarAjuda() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        origem: 'instrucoes',
                        plataforma: plataforma,
                        acao: 'buscar',
                        id_cliente: user.id_cliente,
                        dados: { info_pagina: 'prompts' }
                    })
                });
                if (!res.ok) throw new Error("Erro na API");
                const data = await res.json();
                const item = Array.isArray(data) ? data[0] : data;
                document.getElementById('ajuda-conteudo').innerHTML = item?.texto_instrucao || 'Instrução ainda não cadastrada.';
            } catch (e) {
                console.error("Falha ao carregar instrução:", e);
            }
        }

        function abrirAjuda() {
            document.getElementById('modal-ajuda').classList.remove('hidden');
        }

        function fecharAjuda() {
            document.getElementById('modal-ajuda').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('midiabot_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
