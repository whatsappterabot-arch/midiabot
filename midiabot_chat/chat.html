<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midiabot_chat</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f5f0e8] font-sans h-screen overflow-hidden flex flex-col">

    <!-- SELETOR DE SALAS -->
    <header class="bg-[#001f3f] text-white flex-shrink-0">
        <!-- Desktop: faixa de abas -->
        <div id="abas-salas" class="hidden sm:flex items-center gap-1 px-3 overflow-x-auto"></div>
        <!-- Mobile: dropdown -->
        <div class="sm:hidden p-2">
            <select id="select-sala-mobile"
                class="w-full bg-[#00284f] text-white border border-blue-900 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="">Selecione uma sala...</option>
            </select>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- PAINEL: LISTA DE CONVERSAS -->
        <div id="painel-lista" class="w-full sm:w-80 sm:flex-shrink-0 flex flex-col sm:flex border-r border-gray-300 bg-[#f5f0e8]">
            <div class="p-3 border-b border-gray-300 bg-white flex-shrink-0">
                <button onclick="abrirNovaConversa()" class="w-full text-xs font-bold text-[#00b34d] uppercase tracking-widest py-2 hover:underline">
                    + Nova conversa
                </button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div id="lista-conversas" class="divide-y divide-gray-200">
                    <div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">
                        Selecione uma sala acima
                    </div>
                </div>
            </div>
        </div>

        <!-- PAINEL: CONVERSA ABERTA -->
        <div id="painel-conversa" class="hidden sm:flex flex-col flex-1 overflow-hidden">
            <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-300 flex-shrink-0">
                <button onclick="fecharConversa()" class="sm:hidden text-gray-500 hover:text-gray-800">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <p id="titulo-conversa" class="text-sm font-bold text-gray-800 font-mono"></p>
            </div>
            <div id="mensagens" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
            <div class="flex items-center gap-2 p-3 bg-white border-t border-gray-300 flex-shrink-0">
                <input type="text" id="input-mensagem" placeholder="Escreva uma mensagem..."
                    class="flex-1 bg-gray-50 border border-gray-200 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                <button onclick="enviarMensagem()"
                    class="bg-[#001f3f] text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-black transition-all active:scale-95 flex-shrink-0">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- MODAL: NOVA CONVERSA -->
    <div id="modal-nova-conversa" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Nova conversa</h3>

            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Número (sem @, só dígitos)</label>
            <input type="text" id="input-novo-numero" placeholder="Ex: 5511999999999"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-4 outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">

            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Instância</label>
            <select id="select-nova-instancia"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-1 outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">
                <option value="">Selecione uma instância...</option>
            </select>
            <p id="sugestao-instancia" class="text-[10px] text-gray-400 mb-4 min-h-[1em]"></p>

            <div class="flex gap-2">
                <button onclick="fecharNovaConversa()"
                    class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-200 transition-all">
                    Cancelar
                </button>
                <button onclick="confirmarNovaConversa()"
                    class="flex-1 bg-[#001f3f] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black transition-all active:scale-95">
                    Iniciar
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        const API_URL = CONFIG.API_URL;

        let sessao = null;
        let salas = [];
        let salaSelecionada = '';
        let conversaSelecionada = null;
        let instanciasCliente = [];

        document.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('midiachat_session');
            if (!raw) {
                window.location.href = 'index.html';
                return;
            }
            sessao = JSON.parse(raw);

            document.getElementById('select-sala-mobile').addEventListener('change', (e) => {
                selecionarSala(e.target.value);
            });

            document.getElementById('input-novo-numero').addEventListener('blur', buscarSugestaoInstancia);

            carregarSalas();
        });

        async function chamarApi(acao, dadosExtra) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    acao: acao,
                    token: sessao.token,
                    dados: dadosExtra || {}
                })
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function carregarSalas() {
            try {
                const data = await chamarApi('listar_salas', {});
                salas = (Array.isArray(data) ? data : []).filter(item => item && item.chat_id != null);
                renderizarAbas();

                if (salas.length > 0) {
                    selecionarSala(String(salas[0].chat_id));
                } else {
                    document.getElementById('lista-conversas').innerHTML =
                        '<div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">Nenhuma sala cadastrada ainda</div>';
                }
            } catch (e) {
                console.error("Falha ao carregar salas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function renderizarAbas() {
            const abas = document.getElementById('abas-salas');
            const selectMobile = document.getElementById('select-sala-mobile');

            abas.innerHTML = salas.map(sala => `
                <button onclick="window.__selecionarSala('${sala.chat_id}')"
                    data-chat-id="${sala.chat_id}"
                    class="aba-sala flex-shrink-0 px-4 py-2 my-2 rounded-full text-xs font-bold uppercase tracking-widest whitespace-nowrap text-blue-200 hover:text-white transition-all">
                    ${escapeHtml(sala.chat_id_nome || sala.chat_id)}
                </button>
            `).join('');

            selectMobile.innerHTML = '<option value="">Selecione uma sala...</option>' +
                salas.map(sala => `<option value="${sala.chat_id}">${escapeHtml(sala.chat_id_nome || sala.chat_id)} (${escapeHtml(sala.workflow_name)})</option>`).join('');
        }

        window.__selecionarSala = selecionarSala;

        async function selecionarSala(chatId) {
            if (!chatId) return;
            salaSelecionada = chatId;
            fecharConversa();

            document.getElementById('select-sala-mobile').value = chatId;
            document.querySelectorAll('.aba-sala').forEach(btn => {
                const ativa = btn.dataset.chatId === String(chatId);
                btn.classList.toggle('bg-[#00b34d]', ativa);
                btn.classList.toggle('shadow-md', ativa);
                btn.classList.toggle('text-white', ativa);
                btn.classList.toggle('text-blue-200', !ativa);
            });

            await carregarConversas();
        }

        async function carregarConversas() {
            const container = document.getElementById('lista-conversas');
            try {
                const data = await chamarApi('listar_conversas', { chat_id: salaSelecionada });
                const conversas = (Array.isArray(data) ? data : []).filter(item => item && item.remotejid != null);

                if (conversas.length === 0) {
                    container.innerHTML = '<div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">Nenhuma conversa nessa sala</div>';
                    return;
                }

                container.innerHTML = conversas.map(c => `
                    <div onclick="window.__abrirConversa('${c.remotejid}')"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white cursor-pointer transition-all">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-gray-800 font-mono">${escapeHtml(c.remotejid)}</p>
                            <p class="text-xs text-gray-400 truncate">${escapeHtml(c.mensagem || c.caption) || '(sem prévia)'}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Falha ao carregar conversas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.__abrirConversa = abrirConversa;

        function abrirConversa(remotejid) {
            conversaSelecionada = remotejid;
            document.getElementById('painel-lista').classList.add('hidden');
            document.getElementById('painel-conversa').classList.remove('hidden');
            document.getElementById('titulo-conversa').innerText = remotejid;
            carregarMensagens();
        }

        window.fecharConversa = fecharConversa;

        function fecharConversa() {
            conversaSelecionada = null;
            document.getElementById('painel-lista').classList.remove('hidden');
            document.getElementById('painel-conversa').classList.add('hidden');
        }

        async function carregarMensagens() {
            const container = document.getElementById('mensagens');
            container.innerHTML = '<div class="p-8 text-center text-gray-400 text-xs">Carregando...</div>';

            try {
                const data = await chamarApi('listar_mensagens', { remotejid: conversaSelecionada });
                const mensagens = (Array.isArray(data) ? data : []).filter(item => item && item.datetime != null);

                if (mensagens.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-gray-400 text-xs">Nenhuma mensagem ainda</div>';
                    return;
                }

                container.innerHTML = mensagens.map(m => `
                    <div class="flex ${m.from_me ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[90%] rounded-2xl px-4 py-2 text-sm text-black ${m.from_me ? 'bg-[#dcf8c6]' : 'bg-white'}">
                            ${escapeHtml(m.mensagem || m.caption) || '(mensagem sem texto)'}
                        </div>
                    </div>
                `).join('');

                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Falha ao carregar mensagens:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.enviarMensagem = enviarMensagem;

        async function enviarMensagem() {
            const input = document.getElementById('input-mensagem');
            const texto = input.value.trim();
            if (!texto || !conversaSelecionada) return;

            input.disabled = true;
            try {
                await chamarApi('enviar_mensagem', {
                    remotejid: conversaSelecionada,
                    chat_id: salaSelecionada,
                    mensagem: texto
                });
                input.value = '';
                await carregarMensagens();
            } catch (e) {
                console.error("Falha ao enviar mensagem:", e);
                showToast("Erro ao processar solicitação.", "error");
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        document.getElementById('input-mensagem').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensagem();
            }
        });

        window.abrirNovaConversa = abrirNovaConversa;
        window.fecharNovaConversa = fecharNovaConversa;
        window.confirmarNovaConversa = confirmarNovaConversa;

        async function abrirNovaConversa() {
            if (!salaSelecionada) {
                showToast("Selecione uma sala primeiro.", "warning");
                return;
            }
            document.getElementById('input-novo-numero').value = '';
            document.getElementById('sugestao-instancia').innerText = '';

            if (instanciasCliente.length === 0) {
                await carregarInstancias();
            }
            renderizarSelectInstancias();

            document.getElementById('modal-nova-conversa').classList.remove('hidden');
        }

        function fecharNovaConversa() {
            document.getElementById('modal-nova-conversa').classList.add('hidden');
        }

        async function carregarInstancias() {
            try {
                const data = await chamarApi('listar_instancias', {});
                instanciasCliente = (Array.isArray(data) ? data : []).filter(item => item && item.nome_instancia != null);
            } catch (e) {
                console.error("Falha ao carregar instâncias:", e);
                instanciasCliente = [];
            }
        }

        function renderizarSelectInstancias(sugestao) {
            const select = document.getElementById('select-nova-instancia');
            select.innerHTML = '<option value="">Selecione uma instância...</option>' +
                instanciasCliente.map(i => `<option value="${escapeHtml(i.nome_instancia)}">${escapeHtml(i.nome_instancia)} (${escapeHtml(i.sender)})</option>`).join('');
            if (sugestao) select.value = sugestao;
        }

        async function buscarSugestaoInstancia() {
            const numero = document.getElementById('input-novo-numero').value.trim();
            const aviso = document.getElementById('sugestao-instancia');
            if (!numero) {
                aviso.innerText = '';
                return;
            }

            const remotejid = numero + '@s.whatsapp.net';
            try {
                const data = await chamarApi('buscar_instancia_sugerida', { remotejid });
                const item = Array.isArray(data) ? data[0] : data;

                if (item && item.last_instance) {
                    renderizarSelectInstancias(item.last_instance);
                    aviso.innerText = `Sugestão: ${item.last_instance} (já falou com este número antes).`;
                } else {
                    renderizarSelectInstancias();
                    aviso.innerText = 'Nenhuma instância anterior encontrada — escolha uma.';
                }
            } catch (e) {
                console.error("Falha ao buscar sugestão de instância:", e);
            }
        }

        async function confirmarNovaConversa() {
            const numero = document.getElementById('input-novo-numero').value.trim();
            const instancia = document.getElementById('select-nova-instancia').value;

            if (!numero) {
                showToast("Digite o número.", "warning");
                return;
            }
            if (!instancia) {
                showToast("Escolha uma instância.", "warning");
                return;
            }

            const remotejid = numero + '@s.whatsapp.net';

            try {
                await chamarApi('iniciar_conversa', {
                    remotejid: remotejid,
                    chat_id: salaSelecionada,
                    instancia: instancia
                });
                fecharNovaConversa();
                showToast("Conversa iniciada.", "success");
                await carregarConversas();
                abrirConversa(remotejid);
            } catch (e) {
                console.error("Falha ao iniciar conversa:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }
    </script>
</body>
</html>
