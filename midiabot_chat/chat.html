<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midiabot_chat</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
</head>
<body class="bg-[#f5f0e8] font-sans h-screen overflow-hidden flex flex-col">

    <!-- SELETOR DE SALAS -->
    <header class="bg-[#001f3f] text-white flex-shrink-0 flex items-center">
        <!-- Desktop: faixa de abas -->
        <div id="abas-salas" class="hidden sm:flex items-center gap-1 px-3 overflow-x-auto flex-1"></div>
        <!-- Mobile: dropdown -->
        <div class="sm:hidden p-2 flex-1">
            <select id="select-sala-mobile"
                class="w-full bg-[#00284f] text-white border border-blue-900 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="">Selecione uma sala...</option>
            </select>
        </div>
        <button onclick="sair()" title="Sair" class="flex-shrink-0 text-blue-200 hover:text-white px-3">
            <i class="fas fa-right-from-bracket"></i>
        </button>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- PAINEL: LISTA DE CONVERSAS -->
        <div id="painel-lista" class="w-full sm:w-80 sm:flex-shrink-0 flex flex-col sm:flex border-r border-gray-300 bg-[#f5f0e8]">
            <div class="p-3 border-b border-gray-300 bg-white flex-shrink-0">
                <button onclick="abrirNovaConversa()" class="w-full text-xs font-bold text-[#00b34d] uppercase tracking-widest py-2 hover:underline">
                    + Nova conversa
                </button>
                <button id="btn-toggle-arquivadas" onclick="window.__alternarModoArquivadas()" class="w-full text-xs font-bold text-gray-400 uppercase tracking-widest py-1 hover:underline hover:text-gray-600">
                    Arquivadas
                </button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div id="lista-conversas" class="divide-y divide-gray-200">
                    <div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">
                        Selecione uma sala acima
                    </div>
                </div>
            </div>
        </div>

        <!-- PAINEL: CONVERSA ABERTA -->
        <div id="painel-conversa" class="hidden sm:flex flex-col flex-1 overflow-hidden">
            <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-300 flex-shrink-0">
                <button onclick="fecharConversa()" class="sm:hidden text-gray-500 hover:text-gray-800">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <p id="titulo-conversa" class="text-sm font-bold text-gray-800 font-mono"></p>
            </div>
            <div id="mensagens" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
            <div class="flex items-center gap-2 p-3 bg-white border-t border-gray-300 flex-shrink-0">
                <input type="text" id="input-mensagem" placeholder="Escreva uma mensagem..."
                    class="flex-1 bg-gray-50 border border-gray-200 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                <button onclick="enviarMensagem()"
                    class="bg-[#001f3f] text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-black transition-all active:scale-95 flex-shrink-0">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- MODAL: EDITAR CONTATO -->
    <div id="modal-contato" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Editar contato</h3>

            <div class="flex gap-2 mb-4">
                <div class="w-16 flex-shrink-0">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Emoji</label>
                    <input type="text" id="input-contato-emoji" maxlength="4"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-2 py-3 text-sm text-center outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Apelido</label>
                    <input type="text" id="input-contato-apelido" placeholder="Como esse cliente aparece na lista"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">
                </div>
            </div>

            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Observações</label>
            <textarea id="input-contato-observacoes" rows="3" placeholder="Anotações sobre esse cliente, visíveis pra toda a equipe"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-4 outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all resize-none"></textarea>

            <div class="flex gap-2">
                <button onclick="fecharContato()"
                    class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-200 transition-all">
                    Cancelar
                </button>
                <button onclick="confirmarContato()"
                    class="flex-1 bg-[#001f3f] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black transition-all active:scale-95">
                    Salvar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: NOVA CONVERSA -->
    <div id="modal-nova-conversa" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Nova conversa</h3>

            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Número do WhatsApp</label>
            <input type="text" id="input-novo-numero" placeholder="Ex: 5511999999999"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-4 outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">

            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Instância</label>
            <select id="select-nova-instancia"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-1 outline-none focus:ring-2 focus:ring-[#00b34d] focus:bg-white transition-all">
                <option value="">Selecione uma instância...</option>
            </select>
            <p id="sugestao-instancia" class="text-[10px] text-gray-400 mb-4 min-h-[1em]"></p>

            <div class="flex gap-2">
                <button onclick="fecharNovaConversa()"
                    class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-200 transition-all">
                    Cancelar
                </button>
                <button onclick="confirmarNovaConversa()"
                    class="flex-1 bg-[#001f3f] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black transition-all active:scale-95">
                    Iniciar
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        const API_URL = CONFIG.API_URL;

        let sessao = null;
        let salas = [];
        let salaSelecionada = '';
        let conversaSelecionada = null;
        let instanciasCliente = [];
        let contatosCache = {};
        let contatoSelecionado = null;
        let modoArquivadas = false;

        window.sair = sair;

        function sair() {
            localStorage.removeItem('midiachat_session');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('midiachat_session');
            if (!raw) {
                window.location.href = 'index.html';
                return;
            }
            sessao = JSON.parse(raw);

            document.getElementById('select-sala-mobile').addEventListener('change', (e) => {
                selecionarSala(e.target.value);
            });

            document.getElementById('input-novo-numero').addEventListener('blur', buscarSugestaoInstancia);

            conectarPusher();
            carregarSalas();
        });

        function conectarPusher() {
            const pusher = new Pusher(CONFIG.PUSHER_KEY, {
                cluster: CONFIG.PUSHER_CLUSTER,
                channelAuthorization: {
                    endpoint: `${CONFIG.PUSHER_AUTH_URL}?token=${sessao.token}`,
                    transport: 'ajax'
                }
            });
            const canal = pusher.subscribe(`private-cliente-${sessao.id_cliente}`);
            canal.bind('nova-mensagem', (dados) => {
                if (String(dados.chat_id) === String(salaSelecionada)) {
                    carregarConversas();
                }
                if (dados.remote_jid === conversaSelecionada) {
                    carregarMensagens(false);
                }
                atualizarContadoresSalas();
            });
        }

        async function chamarApi(acao, dadosExtra) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    acao: acao,
                    token: sessao.token,
                    dados: dadosExtra || {}
                })
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Converte marcação estilo WhatsApp (*negrito*, _itálico_, ~riscado~) em HTML.
        // Só chamar DEPOIS de escapeHtml — as tags aqui são fixas, não abrem brecha nenhuma.
        function formatarWhatsApp(textoEscapado) {
            return textoEscapado
                .replace(/\*([^\*\n]+)\*/g, '<b>$1</b>')
                .replace(/_([^_\n]+)_/g, '<i>$1</i>')
                .replace(/~([^~\n]+)~/g, '<s>$1</s>')
                .replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (url) => {
                    const trailing = url.match(/[.,;:!?)]+$/);
                    const trim = trailing ? trailing[0] : '';
                    const limpa = trim ? url.slice(0, -trim.length) : url;
                    const href = /^https?:\/\//i.test(limpa) ? limpa : `https://${limpa}`;
                    return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="underline text-blue-600">${limpa}</a>${trim}`;
                });
        }

        function numeroSemSufixo(remotejid) {
            return remotejid ? remotejid.split('@')[0] : '';
        }

        function formatarDataHora(datetime) {
            if (!datetime) return '';
            const d = new Date(datetime);
            const data = d.toLocaleDateString('pt-BR');
            const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            return `${data} ${hora}`;
        }

        async function carregarSalas() {
            try {
                const data = await chamarApi('listar_salas', {});
                salas = (Array.isArray(data) ? data : []).filter(item => item && item.chat_id != null);
                renderizarAbas();

                if (salas.length > 0) {
                    selecionarSala(String(salas[0].chat_id));
                } else {
                    document.getElementById('lista-conversas').innerHTML =
                        '<div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">Nenhuma sala cadastrada ainda</div>';
                }
            } catch (e) {
                console.error("Falha ao carregar salas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function renderizarAbas() {
            const abas = document.getElementById('abas-salas');
            const selectMobile = document.getElementById('select-sala-mobile');

            abas.innerHTML = salas.map(sala => {
                const pendentes = Number(sala.pendentes) || 0;
                const badge = pendentes > 0
                    ? `<span class="ml-1 bg-red-500 text-white text-[10px] font-bold rounded-full px-1.5 py-0.5">${pendentes}</span>`
                    : '';
                return `
                <button onclick="window.__selecionarSala('${sala.chat_id}')"
                    data-chat-id="${sala.chat_id}"
                    class="aba-sala flex-shrink-0 px-4 py-2 my-2 rounded-full text-xs font-bold uppercase tracking-widest whitespace-nowrap text-blue-200 hover:text-white transition-all">
                    ${escapeHtml(sala.chat_id_nome || sala.chat_id)} - ${escapeHtml(sala.workflow_name)}${badge}
                </button>
            `;
            }).join('');

            selectMobile.innerHTML = '<option value="">Selecione uma sala...</option>' +
                salas.map(sala => {
                    const pendentes = Number(sala.pendentes) || 0;
                    const sufixo = pendentes > 0 ? ` (${pendentes})` : '';
                    return `<option value="${sala.chat_id}">${escapeHtml(sala.chat_id_nome || sala.chat_id)} - ${escapeHtml(sala.workflow_name)}${sufixo}</option>`;
                }).join('');
        }

        window.__selecionarSala = selecionarSala;

        async function selecionarSala(chatId) {
            if (!chatId) return;
            salaSelecionada = chatId;
            fecharConversa();

            if (modoArquivadas) {
                modoArquivadas = false;
                document.getElementById('btn-toggle-arquivadas').innerText = 'Arquivadas';
            }

            document.getElementById('select-sala-mobile').value = chatId;
            document.querySelectorAll('.aba-sala').forEach(btn => {
                const ativa = btn.dataset.chatId === String(chatId);
                btn.classList.toggle('bg-[#00b34d]', ativa);
                btn.classList.toggle('shadow-md', ativa);
                btn.classList.toggle('text-white', ativa);
                btn.classList.toggle('text-blue-200', !ativa);
            });

            await carregarConversas();
        }

        async function carregarConversas() {
            const container = document.getElementById('lista-conversas');
            try {
                const acao = modoArquivadas ? 'listar_arquivadas' : 'listar_conversas';
                const data = await chamarApi(acao, { chat_id: salaSelecionada });
                const conversas = (Array.isArray(data) ? data : []).filter(item => item && item.remotejid != null);

                if (conversas.length === 0) {
                    const mensagemVazio = modoArquivadas ? 'Nenhuma conversa arquivada' : 'Nenhuma conversa nessa sala';
                    container.innerHTML = `<div class="p-12 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">${mensagemVazio}</div>`;
                    return;
                }

                container.innerHTML = conversas.map(c => {
                    const numero = numeroSemSufixo(c.remotejid);
                    contatosCache[c.remotejid] = {
                        apelido: c.apelido || '',
                        emoji: c.emoji || '',
                        observacoes: c.observacoes || ''
                    };
                    const titulo = c.apelido
                        ? `${c.emoji ? c.emoji + ' ' : ''}${c.apelido}`
                        : (c.pushname ? `${c.pushname} - ${numero}` : numero);
                    const ativa = c.remotejid === conversaSelecionada;
                    const pontoNaoLida = c.nao_lida
                        ? '<span class="ponto-nao-lida flex-shrink-0 w-2.5 h-2.5 rounded-full bg-[#00b34d]"></span>'
                        : '';
                    const botaoArquivo = modoArquivadas
                        ? `<button onclick="event.stopPropagation(); window.__desarquivarConversa('${c.remotejid}')"
                            title="Desarquivar conversa"
                            class="flex-shrink-0 text-gray-300 hover:text-gray-600 transition-all p-1">
                            <i class="fas fa-undo text-xs"></i>
                        </button>`
                        : `<button onclick="event.stopPropagation(); window.__arquivarConversa('${c.remotejid}')"
                            title="Arquivar conversa"
                            class="flex-shrink-0 text-gray-300 hover:text-gray-600 transition-all p-1">
                            <i class="fas fa-box-archive text-xs"></i>
                        </button>`;
                    return `
                    <div onclick="window.__abrirConversa('${c.remotejid}')"
                        data-remotejid="${escapeHtml(c.remotejid)}"
                        class="linha-conversa flex items-center gap-3 px-4 py-3 cursor-pointer transition-all ${ativa ? 'bg-gray-200' : 'hover:bg-white'}">
                        ${pontoNaoLida}
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-gray-800">${escapeHtml(titulo)}</p>
                            <p class="text-xs text-gray-400 truncate">${escapeHtml(c.mensagem || c.caption) || '(sem prévia)'}</p>
                        </div>
                        <button onclick="event.stopPropagation(); window.__abrirContato('${c.remotejid}')"
                            title="Editar contato"
                            class="flex-shrink-0 text-gray-300 hover:text-gray-600 transition-all p-1">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                        ${botaoArquivo}
                    </div>
                `;
                }).join('');
            } catch (e) {
                console.error("Falha ao carregar conversas:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.__alternarModoArquivadas = alternarModoArquivadas;

        function alternarModoArquivadas() {
            modoArquivadas = !modoArquivadas;
            const btn = document.getElementById('btn-toggle-arquivadas');
            btn.innerText = modoArquivadas ? '← Voltar para conversas' : 'Arquivadas';
            fecharConversa();
            carregarConversas();
        }

        window.__arquivarConversa = arquivarConversa;
        window.__desarquivarConversa = desarquivarConversa;

        async function arquivarConversa(remotejid) {
            try {
                await chamarApi('arquivar_conversa', { remotejid: remotejid, chat_id: salaSelecionada });
                showToast("Conversa arquivada.", "success");
                await carregarConversas();
                atualizarContadoresSalas();
            } catch (e) {
                console.error("Falha ao arquivar conversa:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function desarquivarConversa(remotejid) {
            try {
                await chamarApi('desarquivar_conversa', { remotejid: remotejid, chat_id: salaSelecionada });
                showToast("Conversa desarquivada.", "success");
                await carregarConversas();
                atualizarContadoresSalas();
            } catch (e) {
                console.error("Falha ao desarquivar conversa:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.__abrirConversa = abrirConversa;

        function abrirConversa(remotejid) {
            conversaSelecionada = remotejid;
            document.getElementById('painel-lista').classList.add('hidden');
            document.getElementById('painel-conversa').classList.remove('hidden');
            document.getElementById('titulo-conversa').innerText = numeroSemSufixo(remotejid);
            destacarConversaAtiva();
            carregarMensagens();
            marcarLida(remotejid);
        }

        async function marcarLida(remotejid) {
            try {
                await chamarApi('marcar_lida', { remotejid: remotejid, chat_id: salaSelecionada });
                const linha = document.querySelector(`.linha-conversa[data-remotejid="${CSS.escape(remotejid)}"]`);
                const ponto = linha ? linha.querySelector('.ponto-nao-lida') : null;
                if (ponto) ponto.remove();
                atualizarContadoresSalas();
            } catch (e) {
                console.error("Falha ao marcar como lida:", e);
            }
        }

        async function atualizarContadoresSalas() {
            try {
                const data = await chamarApi('listar_salas', {});
                salas = (Array.isArray(data) ? data : []).filter(item => item && item.chat_id != null);
                renderizarAbas();
                document.getElementById('select-sala-mobile').value = salaSelecionada;
                document.querySelectorAll('.aba-sala').forEach(btn => {
                    const ativa = btn.dataset.chatId === String(salaSelecionada);
                    btn.classList.toggle('bg-[#00b34d]', ativa);
                    btn.classList.toggle('shadow-md', ativa);
                    btn.classList.toggle('text-white', ativa);
                    btn.classList.toggle('text-blue-200', !ativa);
                });
            } catch (e) {
                console.error("Falha ao atualizar contadores de salas:", e);
            }
        }

        function destacarConversaAtiva() {
            document.querySelectorAll('.linha-conversa').forEach(linha => {
                const ativa = linha.dataset.remotejid === conversaSelecionada;
                linha.classList.toggle('bg-gray-200', ativa);
                linha.classList.toggle('hover:bg-white', !ativa);
            });
        }

        window.fecharConversa = fecharConversa;

        function fecharConversa() {
            conversaSelecionada = null;
            document.getElementById('painel-lista').classList.remove('hidden');
            document.getElementById('painel-conversa').classList.add('hidden');
            document.getElementById('titulo-conversa').innerText = '';
            document.getElementById('mensagens').innerHTML =
                '<div class="p-8 text-center text-gray-400 text-xs">Selecione uma conversa</div>';
            destacarConversaAtiva();
        }

        const ICONES_MIDIA = {
            imagem: 'fa-image',
            audio: 'fa-music',
            video: 'fa-video',
            documento: 'fa-file'
        };

        const ROTULOS_MIDIA = {
            imagem: 'Imagem',
            audio: 'Áudio',
            video: 'Vídeo',
            documento: 'Documento'
        };

        function tipoMidia(messagetype) {
            if (messagetype === 'imageMessage') return 'imagem';
            if (messagetype === 'audioMessage') return 'audio';
            if (messagetype === 'videoMessage') return 'video';
            if (messagetype === 'documentMessage') return 'documento';
            return null;
        }

        function resumoMensagemCitada(m) {
            if (!m) return '(mensagem não encontrada)';
            if (m.mensagem) return m.mensagem;
            const tipo = tipoMidia(m.messagetype);
            if (tipo === 'imagem') return `📷 Imagem${m.caption ? ': ' + m.caption : ''}`;
            if (tipo === 'video') return `🎥 Vídeo${m.caption ? ': ' + m.caption : ''}`;
            if (tipo === 'audio') return '🎵 Áudio';
            if (tipo === 'documento') return `📄 ${m.midia || 'Documento'}`;
            return '(mensagem)';
        }

        function renderizarConteudoMensagem(m) {
            if (m.messagetype === 'contactMessage') {
                const salvar = m.caption ? `<div class="mt-1"><a href="javascript:void(0)" onclick="window.__salvarContato(${m.id})" class="text-xs text-blue-600 underline flex items-center gap-1"><i class="fas fa-download"></i> Salvar contato</a></div>` : '';
                return `<span class="whitespace-pre-line">${formatarWhatsApp(escapeHtml(m.mensagem || ''))}</span>${salvar}`;
            }
            const tipo = tipoMidia(m.messagetype);
            if (!tipo) {
                const texto = m.mensagem || m.caption;
                if (texto) return `<span class="whitespace-pre-line">${formatarWhatsApp(escapeHtml(texto))}</span>`;
                if (m.messagetype && m.messagetype !== 'conversation') {
                    return '<span class="text-gray-400 italic">Tipo de mensagem ainda não suportado</span>';
                }
                return '(mensagem sem texto)';
            }
            const rotulo = escapeHtml(tipo === 'documento' && m.midia ? m.midia : ROTULOS_MIDIA[tipo]);
            const legenda = m.caption ? `<div class="mt-1 text-xs whitespace-pre-line">${formatarWhatsApp(escapeHtml(m.caption))}</div>` : '';
            return `
                <div class="cursor-pointer flex items-center gap-2 text-gray-700" onclick="window.__verMidia(${m.id})">
                    <i class="fas ${ICONES_MIDIA[tipo]}"></i>
                    <span class="font-semibold">${rotulo}</span>
                    <span class="text-[10px] text-gray-400">(toque para abrir)</span>
                </div>
                ${legenda}
            `;
        }

        window.__verMidia = verMidia;

        function salvarContato(id) {
            const bolha = document.querySelector(`[data-msg-id="${id}"]`);
            if (!bolha) return;
            const vcard = bolha.dataset.caption || '';
            if (!vcard) return;
            const nomeTexto = bolha.querySelector('.conteudo-mensagem')?.textContent || 'contato';
            const nome = nomeTexto.split('\n')[0].replace(/^👤\s*/, '').trim() || 'contato';
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nome}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        window.__salvarContato = salvarContato;

        async function verMidia(id) {
            const bolha = document.querySelector(`[data-msg-id="${id}"]`);
            if (!bolha) return;
            const conteudo = bolha.querySelector('.conteudo-mensagem');
            const tipo = tipoMidia(bolha.dataset.messagetype);
            const mimeType = bolha.dataset.mimeType || '';
            const nomeArquivo = bolha.dataset.nomeArquivo || 'arquivo';
            const caption = bolha.dataset.caption || '';
            const legenda = caption ? `<div class="mt-1 text-xs whitespace-pre-line">${formatarWhatsApp(escapeHtml(caption))}</div>` : '';

            try {
                const data = await chamarApi('buscar_midia', { id });
                const item = Array.isArray(data) ? data[0] : data;
                const base64 = item && item.base64;
                if (!base64) {
                    showToast("Não foi possível carregar a mídia.", "error");
                    return;
                }
                const src = `data:${mimeType};base64,${base64}`;
                if (tipo === 'imagem') {
                    conteudo.innerHTML = `<img src="${src}" class="max-w-full rounded-lg">${legenda}`;
                } else if (tipo === 'audio') {
                    conteudo.innerHTML = `<audio controls src="${src}" class="max-w-full"></audio>${legenda}`;
                } else if (tipo === 'video') {
                    conteudo.innerHTML = `<video controls src="${src}" class="max-w-full rounded-lg"></video>${legenda}`;
                } else if (tipo === 'documento') {
                    conteudo.innerHTML = `<a href="${src}" download="${nomeArquivo}" class="text-blue-600 underline flex items-center gap-1"><i class="fas fa-download"></i> Baixar ${escapeHtml(nomeArquivo)}</a>${legenda}`;
                }
            } catch (e) {
                console.error("Falha ao carregar mídia:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        async function carregarMensagens(mostrarCarregando = true) {
            const container = document.getElementById('mensagens');
            if (mostrarCarregando) {
                container.innerHTML = '<div class="p-8 text-center text-gray-400 text-xs">Carregando...</div>';
            }

            try {
                const data = await chamarApi('listar_mensagens', { remotejid: conversaSelecionada, chat_id: salaSelecionada });
                const mensagens = (Array.isArray(data) ? data : []).filter(item => item && item.datetime != null);

                if (mensagens.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-gray-400 text-xs">Nenhuma mensagem ainda</div>';
                    return;
                }

                const porId = new Map(mensagens.map(m => [m.id, m]));

                container.innerHTML = mensagens.map(m => {
                    const citada = m.resposta_a ? porId.get(m.resposta_a) : null;
                    const citacaoHtml = m.resposta_a ? `
                        <div class="border-l-4 border-[#00b34d] bg-black/5 rounded px-2 py-1 mb-1 text-xs text-gray-600 truncate">
                            ${formatarWhatsApp(escapeHtml(resumoMensagemCitada(citada)))}
                        </div>
                    ` : '';
                    return `
                    <div class="flex ${m.from_me ? 'justify-end' : 'justify-start'}">
                        <div data-msg-id="${m.id}" data-messagetype="${escapeHtml(m.messagetype || '')}" data-mime-type="${escapeHtml(m.mime_type || '')}" data-nome-arquivo="${escapeHtml(m.midia || '')}" data-caption="${escapeHtml(m.caption || '')}" class="max-w-[90%] rounded-2xl px-4 py-2 text-sm text-black ${m.from_me ? 'bg-[#dcf8c6]' : 'bg-white'}">
                            ${citacaoHtml}
                            <div class="conteudo-mensagem">${renderizarConteudoMensagem(m)}</div>
                            <div class="text-[10px] text-gray-400 text-right mt-1">${formatarDataHora(m.datetime)}</div>
                        </div>
                    </div>
                `;
                }).join('');

                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Falha ao carregar mensagens:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.enviarMensagem = enviarMensagem;

        async function enviarMensagem() {
            const input = document.getElementById('input-mensagem');
            const texto = input.value.trim();
            if (!texto || !conversaSelecionada) return;

            input.disabled = true;
            try {
                await chamarApi('enviar_mensagem', {
                    remotejid: conversaSelecionada,
                    chat_id: salaSelecionada,
                    mensagem: texto
                });
                input.value = '';
                await carregarMensagens(false);
            } catch (e) {
                console.error("Falha ao enviar mensagem:", e);
                showToast("Erro ao processar solicitação.", "error");
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        document.getElementById('input-mensagem').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensagem();
            }
        });

        window.__abrirContato = abrirContato;
        window.fecharContato = fecharContato;
        window.confirmarContato = confirmarContato;

        function abrirContato(remotejid) {
            contatoSelecionado = remotejid;
            const dados = contatosCache[remotejid] || { apelido: '', emoji: '', observacoes: '' };
            document.getElementById('input-contato-emoji').value = dados.emoji;
            document.getElementById('input-contato-apelido').value = dados.apelido;
            document.getElementById('input-contato-observacoes').value = dados.observacoes;
            document.getElementById('modal-contato').classList.remove('hidden');
        }

        function fecharContato() {
            contatoSelecionado = null;
            document.getElementById('modal-contato').classList.add('hidden');
        }

        async function confirmarContato() {
            if (!contatoSelecionado) return;

            const apelido = document.getElementById('input-contato-apelido').value.trim();
            const emoji = document.getElementById('input-contato-emoji').value.trim();
            const observacoes = document.getElementById('input-contato-observacoes').value.trim();

            try {
                await chamarApi('salvar_contato', {
                    remotejid: contatoSelecionado,
                    apelido: apelido,
                    emoji: emoji,
                    observacoes: observacoes
                });
                fecharContato();
                showToast("Contato atualizado.", "success");
                await carregarConversas();
            } catch (e) {
                console.error("Falha ao salvar contato:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        window.abrirNovaConversa = abrirNovaConversa;
        window.fecharNovaConversa = fecharNovaConversa;
        window.confirmarNovaConversa = confirmarNovaConversa;

        async function abrirNovaConversa() {
            if (!salaSelecionada) {
                showToast("Selecione uma sala primeiro.", "warning");
                return;
            }
            document.getElementById('input-novo-numero').value = '';
            document.getElementById('sugestao-instancia').innerText = '';

            if (instanciasCliente.length === 0) {
                await carregarInstancias();
            }
            renderizarSelectInstancias();

            document.getElementById('modal-nova-conversa').classList.remove('hidden');
        }

        function fecharNovaConversa() {
            document.getElementById('modal-nova-conversa').classList.add('hidden');
        }

        async function carregarInstancias() {
            try {
                const data = await chamarApi('listar_instancias', {});
                instanciasCliente = (Array.isArray(data) ? data : []).filter(item => item && item.nome_instancia != null);
            } catch (e) {
                console.error("Falha ao carregar instâncias:", e);
                instanciasCliente = [];
            }
        }

        function renderizarSelectInstancias(sugestao) {
            const select = document.getElementById('select-nova-instancia');
            select.innerHTML = '<option value="">Selecione uma instância...</option>' +
                instanciasCliente.map(i => `<option value="${escapeHtml(i.nome_instancia)}">${escapeHtml(i.nome_instancia)} (${escapeHtml(i.sender)})</option>`).join('');
            if (sugestao) select.value = sugestao;
        }

        async function buscarSugestaoInstancia() {
            const numero = document.getElementById('input-novo-numero').value.trim();
            const aviso = document.getElementById('sugestao-instancia');
            if (!numero) {
                aviso.innerText = '';
                return;
            }

            const remotejid = numero + '@s.whatsapp.net';
            try {
                const data = await chamarApi('buscar_instancia_sugerida', { remotejid });
                const item = Array.isArray(data) ? data[0] : data;

                if (item && item.last_instance) {
                    renderizarSelectInstancias(item.last_instance);
                    aviso.innerText = `Sugestão: ${item.last_instance} (já falou com este número antes).`;
                } else {
                    renderizarSelectInstancias();
                    aviso.innerText = 'Nenhuma instância anterior encontrada — escolha uma.';
                }
            } catch (e) {
                console.error("Falha ao buscar sugestão de instância:", e);
            }
        }

        async function confirmarNovaConversa() {
            const numero = document.getElementById('input-novo-numero').value.trim();
            const instancia = document.getElementById('select-nova-instancia').value;

            if (!numero) {
                showToast("Digite o número.", "warning");
                return;
            }
            if (!instancia) {
                showToast("Escolha uma instância.", "warning");
                return;
            }

            const remotejid = numero + '@s.whatsapp.net';

            try {
                await chamarApi('iniciar_conversa', {
                    remotejid: remotejid,
                    chat_id: salaSelecionada,
                    instancia: instancia
                });
                fecharNovaConversa();
                showToast("Conversa iniciada.", "success");
                await carregarConversas();
                abrirConversa(remotejid);
            } catch (e) {
                console.error("Falha ao iniciar conversa:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }
    </script>
</body>
</html>
