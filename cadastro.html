<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiaBot - Complete seu cadastro</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full border-t-4 border-[#00b34d] p-8">
            <div class="flex items-center justify-center gap-3 mb-6">
                <img src="./logo.png" alt="MidiaBot" class="w-10">
                <h1 class="text-xl font-bold text-[#001f3f]">Falta pouco</h1>
            </div>
            <p id="passo-indicador" class="text-center text-xs font-bold text-gray-400 uppercase tracking-widest mb-6"></p>
            <div id="conteudo"></div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        let user = null;

        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData || userData === "undefined") {
                window.location.href = 'index.html';
                return;
            }
            try {
                const rawUser = JSON.parse(userData);
                user = Array.isArray(rawUser) ? rawUser[0] : rawUser;
            } catch (e) {
                window.location.href = 'index.html';
                return;
            }

            // Já completou cadastro antes? Não deveria estar aqui de novo (a não ser que tenha vindo pelo link direto).
            if (user.termos_aceitos_em) {
                window.location.href = 'dashboard.html';
                return;
            }

            render();
        });

        async function chamarApi(acao, dadosExtra) {
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ origem: 'cadastro', acao, id_cliente: user.id_cliente ?? user.id, dados: dadosExtra })
            });
            return res.json();
        }

        let passo = 1;
        const NOMES_PASSO = {
            1: 'Passo 1 de 3 — Dados da empresa',
            2: 'Passo 2 de 3 — Plano',
            3: 'Passo 3 de 3 — Termos'
        };

        let dados = {
            whatsapp: '', nome_fantasia: '', razao_social: '',
            cnpj_cpf: '', cpf_responsavel: '', endereco: '',
            plano_id: null, termos_aceitos: false
        };
        let termosTexto = null;

        function render() {
            document.getElementById('passo-indicador').innerText = NOMES_PASSO[passo] || '';
            const el = document.getElementById('conteudo');
            if (passo === 1) el.innerHTML = telaDados();
            else if (passo === 2) el.innerHTML = telaPlano();
            else if (passo === 3) el.innerHTML = telaTermos();
            ligarEventos();
        }

        // ----- Passo 1 — Dados da empresa -----
        function telaDados() {
            return `
                <p class="text-sm text-gray-500 mb-4">Oi, ${user.nome || user.email}. Antes de continuar, preciso de alguns dados da sua empresa.</p>
                <div class="space-y-3">
                    <input type="text" value="${dados.whatsapp}" data-campo="whatsapp" placeholder="WhatsApp de contato"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="text" value="${dados.nome_fantasia}" data-campo="nome_fantasia" placeholder="Nome fantasia da empresa"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="text" value="${dados.razao_social}" data-campo="razao_social" placeholder="Razão social"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="text" value="${dados.cnpj_cpf}" data-campo="cnpj_cpf" placeholder="CNPJ (ou CPF, se MEI/pessoa física)"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="text" value="${dados.cpf_responsavel}" data-campo="cpf_responsavel" placeholder="Seu CPF (responsável)"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <input type="text" value="${dados.endereco}" data-campo="endereco" placeholder="Endereço completo"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <button data-acao="proximo-dados" class="w-full mt-6 px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
            `;
        }

        // ----- Passo 2 — Plano (só o teste grátis é clicável por enquanto) -----
        function telaPlano() {
            const trialSelecionado = dados.plano_id === 4;
            return `
                <button type="button" data-plano="4" class="w-full text-left border-2 rounded-xl p-5 mb-4 transition-all ${trialSelecionado ? 'border-[#00b34d] bg-green-50' : 'border-gray-200 hover:border-gray-300'}">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-gray-800 text-lg">Teste Grátis — 30 dias</span>
                        <span class="font-bold text-[#00b34d]">R$ 0</span>
                    </div>
                    <p class="text-xs text-gray-500">Mensagens ilimitadas por 30 dias, sem cartão de crédito. Comece agora.</p>
                </button>
                <div class="border-2 border-dashed border-gray-200 rounded-xl p-5 mb-4 opacity-60">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-gray-500">Planos Bronze / Prata / Ouro</span>
                        <span class="text-xs font-bold text-gray-400 uppercase">Em breve</span>
                    </div>
                    <p class="text-xs text-gray-400">Disponíveis assim que o pagamento online estiver pronto.</p>
                </div>
                <div class="flex justify-between mt-4">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="proximo-plano" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Próximo</button>
                </div>
            `;
        }

        // ----- Passo 3 — Termos -----
        function telaTermos() {
            return `
                <div class="border border-gray-200 rounded-xl p-4 mb-4 h-48 overflow-y-auto text-xs text-gray-500 leading-relaxed whitespace-pre-line">
                    ${termosTexto === null ? 'Carregando...' : termosTexto}
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-600 mb-6">
                    <input type="checkbox" data-campo="termos_aceitos" ${dados.termos_aceitos ? 'checked' : ''}>
                    Li e aceito os termos de uso.
                </label>
                <div id="termos-aviso" class="hidden mb-4 text-xs text-red-600">Marque a caixa pra continuar.</div>
                <div class="flex justify-between mt-4">
                    <button data-acao="voltar" class="px-5 py-3 text-gray-500 font-bold">Voltar</button>
                    <button data-acao="finalizar" id="btn-finalizar" class="px-5 py-3 bg-[#00b34d] text-white font-bold rounded-xl hover:bg-green-600">Começar meu teste grátis</button>
                </div>
            `;
        }

        function ligarEventos() {
            const el = document.getElementById('conteudo');

            el.querySelectorAll('[data-campo]').forEach(i => {
                const evento = i.type === 'checkbox' ? 'onchange' : 'oninput';
                i[evento] = () => { dados[i.dataset.campo] = i.type === 'checkbox' ? i.checked : i.value; };
            });

            el.querySelectorAll('[data-acao="proximo-dados"]').forEach(b => b.onclick = () => { passo = 2; render(); });
            el.querySelectorAll('[data-plano]').forEach(b => b.onclick = () => { dados.plano_id = Number(b.dataset.plano); render(); });
            el.querySelectorAll('[data-acao="proximo-plano"]').forEach(b => b.onclick = async () => {
                if (!dados.plano_id) { showToast('Escolha o teste grátis pra continuar.', 'warning'); return; }
                passo = 3;
                render();
                if (termosTexto === null) {
                    try {
                        const resultado = await chamarApi('buscar_termos', {});
                        const linha = Array.isArray(resultado) ? resultado[0] : resultado;
                        termosTexto = linha?.texto || 'Não foi possível carregar os termos agora.';
                    } catch (e) {
                        console.error(e);
                        termosTexto = 'Não foi possível carregar os termos agora.';
                    }
                    render();
                }
            });
            el.querySelectorAll('[data-acao="voltar"]').forEach(b => b.onclick = () => { passo--; render(); });

            el.querySelectorAll('[data-acao="finalizar"]').forEach(b => b.onclick = async () => {
                if (!dados.termos_aceitos) {
                    document.getElementById('termos-aviso').classList.remove('hidden');
                    return;
                }
                const botao = document.getElementById('btn-finalizar');
                botao.disabled = true;
                botao.innerText = 'Enviando...';
                try {
                    const resultado = await chamarApi('completar_cadastro', dados);
                    const atualizado = Array.isArray(resultado) ? resultado[0] : resultado;
                    // Atualiza o localStorage pra não precisar logar de novo pra liberar o dashboard
                    const userAtualizado = { ...user, ...atualizado, plano_id: dados.plano_id, termos_aceitos_em: new Date().toISOString() };
                    localStorage.setItem('midiabot_user', JSON.stringify(userAtualizado));
                    window.location.href = 'dashboard.html';
                } catch (e) {
                    console.error(e);
                    showToast('Não foi possível concluir. Tenta de novo.', 'error');
                    botao.disabled = false;
                    botao.innerText = 'Começar meu teste grátis';
                }
            });
        }
    </script>
</body>
</html>
