<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiaBot - Cadastro de Consultores</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen">
        <!-- SIDEBAR: Menu Lateral Dinâmico -->
        <aside class="w-64 bg-[#001f3f] text-white flex flex-col shadow-xl">
            <div class="p-6 text-center border-b border-blue-900">
                <img src="./logo.png" alt="Logo" class="w-12 mx-auto mb-2">
                <h2 class="font-black tracking-tighter text-xl">MÍDIABOT</h2>
            </div>

            <!-- TOGGLE DE PLATAFORMA -->
            <div class="p-4">
                <div class="flex bg-gray-800 rounded-full p-1 shadow-inner">
                    <button onclick="setPlataforma('whatsapp')" id="btn-wa"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md">
                        WHATSAPP
                    </button>
                    <button onclick="setPlataforma('instagram')" id="btn-ig"
                        class="flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700">
                        INSTAGRAM
                    </button>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1 mt-4" id="menu-dinamico">
                <!-- Injetado via Java -->
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col">
            <!-- HEADER -->
            <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-key text-gray-400"></i>
                    <h1 class="text-sm font-bold text-gray-500 uppercase tracking-widest" id="page-title">Cadastro de Consultores (WhatsApp)</h1>
                    <button onclick="abrirAjuda()" class="w-5 h-5 rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 transition-colors flex items-center justify-center text-[10px] font-bold">
                        ?
                    </button>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-bold text-gray-800">Carregando...</p>
                        <p id="user-id" class="text-[10px] text-gray-400 font-mono"></p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- ÁREA DE GESTÃO -->
            <section class="p-8 overflow-y-auto flex-1">
                <div class="max-w-6xl mx-auto">
                    <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 mb-4 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Antes de entregar uma senha</p>
                            <p class="text-xs text-gray-500">Baixe e preencha um termo de entrega pra cada colaborador que vai acessar o chat.</p>
                        </div>
                        <a href="Termo_Entrega_Senha_MidiaBot.docx" download class="flex-shrink-0 inline-flex items-center gap-2 text-sm font-bold text-[#00b34d] hover:underline">
                            <i class="fas fa-file-word"></i>Baixar termo (.docx)
                        </a>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">#</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Nome</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Login</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Senha</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">Cor</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">Ativo</th>
                                    <th class="px-4 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-corpo" class="divide-y divide-gray-100">
                                <!-- Injetado via Java -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL AJUDA -->
    <div id="modal-ajuda" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full relative shadow-2xl max-h-[80vh] overflow-y-auto">
            <button onclick="fecharAjuda()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-widest mb-4">Como funciona</h3>
            <div id="ajuda-conteudo" class="text-sm text-gray-600 leading-relaxed"></div>
        </div>
    </div>

    <script type="module">
        import { CONFIG, showToast } from "./config.js";

        const API_URL = CONFIG.API_URL;
        const TOTAL_VAGAS = 10;

        let user = null;
        let plataforma = 'whatsapp';

        // Inicialização e Proteção de Rota
        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('midiabot_user');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }

            const rawUser = JSON.parse(userData);
            user = Array.isArray(rawUser) ? rawUser[0] : rawUser;

            document.getElementById('user-name').innerText = user.nome || 'Usuário';
            document.getElementById('user-id').innerText = `ID: ${user.id_cliente}`;

            window.setPlataforma = setPlataforma;
            window.salvarLogin = salvarLogin;
            window.abrirAjuda = abrirAjuda;
            window.fecharAjuda = fecharAjuda;
            window.logout = logout;

            renderMenu();
            carregarLogins();
            carregarAjuda();
        });

        // Lógica de Menu Lateral Dinâmico
        function renderMenu() {
            const menu = document.getElementById('menu-dinamico');
            const waItems = [
                { icon: 'fa-paper-plane', label: 'Envio Ativo', href: 'envio_ativo.html' },
                { icon: 'fa-server', label: 'Instâncias', href: 'instancias.html' },
                { icon: 'fa-ban', label: 'Proibições de IA', href: 'proibicoes.html' },
                { icon: 'fa-paper-plane', label: 'Conectores de Chat', href: 'telegram_sender.html' },
                { icon: 'fa-user-tie', label: 'Atribuição a Consultores', href: 'consultores.html' },
                { icon: 'fa-users', label: 'Telefones dos Consultores', href: 'vendedores.html' },
                { icon: 'fa-clock', label: 'Horários', href: 'horarios.html' },
                { icon: 'fa-robot', label: 'Prompts', href: 'prompts.html' },
                { icon: 'fa-key', label: 'Cadastro de Consultores', active: true },
                { icon: 'fa-comments', label: 'Atribuição de Chat', href: 'atribuicao_chat.html' }
            ];
            const igItems = [
                { icon: 'fa-hashtag', label: 'Hashtags' },
                { icon: 'fa-users', label: 'Públicos' },
                { icon: 'fa-chart-line', label: 'Métricas' },
                { icon: 'fa-comments', label: 'Directs' }
            ];

            const items = plataforma === 'whatsapp' ? waItems : igItems;
            menu.innerHTML = items.map(item => `
                <a href="${item.href || '#'}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${item.active ? 'bg-[#00b34d] text-white shadow-lg' : 'text-blue-200 hover:bg-blue-900 hover:text-white'}">
                    <i class="fas ${item.icon} w-5 text-center"></i>
                    <span class="text-xs font-bold uppercase tracking-tighter">${item.label}</span>
                </a>
            `).join('');
        }

        // Função Central de Comunicação com n8n
        async function chamarApi(acao, dadosExtra) {
            const payload = {
                origem: 'login_chat',
                plataforma: plataforma,
                acao: acao,
                id_cliente: user.id_cliente,
                dados: dadosExtra
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Erro na API");
            return await res.json();
        }

        async function carregarLogins() {
            try {
                const data = await chamarApi('listar', {});
                renderizarTabela(Array.isArray(data) ? data : []);
            } catch (e) {
                console.error("Falha ao carregar logins:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('tabela-corpo');
            const porId = {};
            dados.forEach(item => { porId[item.id_vendedor] = item; });

            const linhas = [];
            for (let i = 1; i <= TOTAL_VAGAS; i++) {
                const item = porId[i] || {};
                linhas.push(`
                    <tr class="hover:bg-gray-50 transition-colors group">
                        <td class="px-4 py-4 text-center text-sm text-gray-400 font-mono">${i}</td>
                        <td class="px-4 py-4">
                            <input type="text" id="nome-${i}" value="${item.nome_vendedor || ''}" placeholder="Nome"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                        </td>
                        <td class="px-4 py-4">
                            <input type="text" id="login-${i}" value="${item.login || ''}" placeholder="Login"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                        </td>
                        <td class="px-4 py-4">
                            <input type="password" id="senha-${i}" value=""
                                placeholder="${item.tem_senha ? '•••••• (deixe em branco p/ manter)' : '(sem senha definida)'}"
                                class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                            <label class="flex items-center gap-1.5 mt-1.5 text-[10px] text-red-500 font-medium cursor-pointer">
                                <input type="checkbox" id="suspender-${i}" class="w-3 h-3">
                                Suspender acesso
                            </label>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <input type="text" id="cor-${i}" value="${item.cor_emoji || ''}" placeholder="🔴" maxlength="4"
                                class="w-14 text-center bg-gray-50 border border-gray-200 rounded-lg px-2 py-2 text-lg focus:ring-2 focus:ring-[#00b34d] focus:bg-white outline-none transition-all">
                        </td>
                        <td class="px-4 py-4 text-center">
                            <input type="checkbox" id="ativo-${i}" ${item.ativo === 1 ? 'checked' : ''}
                                class="w-5 h-5 accent-[#00b34d] cursor-pointer">
                        </td>
                        <td class="px-4 py-4 text-right">
                            <button onclick="salvarLogin(${i})"
                                class="bg-[#001f3f] text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-black transition-all shadow active:scale-95">
                                SALVAR
                            </button>
                        </td>
                    </tr>
                `);
            }
            corpo.innerHTML = linhas.join('');
        }

        async function salvarLogin(idVendedor) {
            const inputNome = document.getElementById(`nome-${idVendedor}`);
            const inputLogin = document.getElementById(`login-${idVendedor}`);
            const inputSenha = document.getElementById(`senha-${idVendedor}`);
            const inputSuspender = document.getElementById(`suspender-${idVendedor}`);
            const inputCor = document.getElementById(`cor-${idVendedor}`);
            const inputAtivo = document.getElementById(`ativo-${idVendedor}`);

            if (!inputLogin.value.trim()) {
                showToast("Preencha o login.", "warning");
                return;
            }

            try {
                await chamarApi('salvar', {
                    id_vendedor: idVendedor,
                    nome_vendedor: inputNome.value,
                    login: inputLogin.value.trim(),
                    nova_senha: inputSenha.value || '__SEM_ALTERACAO__',
                    suspender: inputSuspender.checked,
                    cor_emoji: inputCor.value,
                    ativo: inputAtivo.checked ? 1 : 0
                });
                inputSenha.value = '';
                inputSuspender.checked = false;
                showToast("Login salvo com sucesso.", "success");
                carregarLogins();
            } catch (e) {
                console.error("Falha ao salvar login:", e);
                showToast("Erro ao processar solicitação.", "error");
            }
        }

        function setPlataforma(p) {
            plataforma = p;
            const isWA = p === 'whatsapp';

            document.getElementById('btn-wa').className = isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-[#00b34d] text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('btn-ig').className = !isWA
                ? "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md"
                : "flex-1 py-1.5 text-[10px] font-bold rounded-full transition-all text-gray-400 hover:bg-gray-700";

            document.getElementById('page-title').innerText = `Cadastro de Consultores (${isWA ? 'WhatsApp' : 'Instagram'})`;

            renderMenu();
        }

        async function carregarAjuda() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        origem: 'instrucoes',
                        plataforma: plataforma,
                        acao: 'buscar',
                        id_cliente: user.id_cliente,
                        dados: { info_pagina: 'senhas_chat' }
                    })
                });
                if (!res.ok) throw new Error("Erro na API");
                const data = await res.json();
                const item = Array.isArray(data) ? data[0] : data;
                document.getElementById('ajuda-conteudo').innerHTML = item?.texto_instrucao || 'Instrução ainda não cadastrada.';
            } catch (e) {
                console.error("Falha ao carregar instrução:", e);
            }
        }

        function abrirAjuda() {
            document.getElementById('modal-ajuda').classList.remove('hidden');
        }

        function fecharAjuda() {
            document.getElementById('modal-ajuda').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('midiabot_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
